name: Build future APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf android-build
          mkdir -p android-build/app/src/main/java/com/futurism/app
          mkdir -p android-build/app/src/main/assets
          mkdir -p android-build/app/src/main/res/drawable
          mkdir -p android-build/app/src/main/res/mipmap-hdpi
          mkdir -p android-build/app/src/main/res/mipmap-mdpi
          mkdir -p android-build/app/src/main/res/mipmap-xhdpi
          mkdir -p android-build/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-build/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android-build/app/src/main/res/xml

          cp index.html android-build/app/src/main/assets/index.html

          if [ -f manifest.json ]; then
            cp manifest.json android-build/app/src/main/assets/manifest.json
          fi

          if [ -f sw.js ]; then
            cp sw.js android-build/app/src/main/assets/sw.js
          fi

          if [ -f future-logo.png ]; then
            cp future-logo.png android-build/app/src/main/assets/future-logo.png
          fi

          if [ -d icons ]; then
            cp -r icons android-build/app/src/main/assets/
          fi

          if [ -f icon-192.png ]; then
            cp icon-192.png android-build/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp icon-192.png android-build/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icon-192.png android-build/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp icon-192.png android-build/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon-192.png android-build/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

          cat > android-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "future"
          include(":app")
          EOF

          cat > android-build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > android-build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android-build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.futurism.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.futurism.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 21
                  versionName '19.15'
              }
          }
          EOF

          mkdir -p android-build/app/src/main/res/values

          cat > android-build/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">future</string>
          </resources>
          EOF

          cat > android-build/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path
                  name="camera_cache"
                  path="." />
          </paths>
          EOF

          cat > android-build/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />

              <application
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <meta-data
                      android:name="com.google.mlkit.vision.DEPENDENCIES"
                      android:value="subject_segment" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

              </application>

          </manifest>
          EOF

          mkdir -p android-build/app/src/main/res/values

          cat > android-build/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#F7F3EE</item>
                  <item name="android:navigationBarColor">#F7F3EE</item>
                  <item name="android:windowLightNavigationBar">true</item>
                  <item name="android:colorAccent">#b9210c</item>
              </style>

          </resources>
          EOF

      - name: Create MainActivity
        shell: bash
        run: |
          cat > android-build/app/src/main/java/com/futurism/app/MainActivity.java <<'EOF'
          package com.futurism.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.util.Base64;
          import android.view.View;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.content.FileProvider;

          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.segmentation.subject.SubjectSegmentation;
          import com.google.mlkit.vision.segmentation.subject.SubjectSegmentationResult;
          import com.google.mlkit.vision.segmentation.subject.SubjectSegmenter;
          import com.google.mlkit.vision.segmentation.subject.SubjectSegmenterOptions;
          import com.google.android.gms.common.moduleinstall.ModuleInstall;
          import com.google.android.gms.common.moduleinstall.ModuleInstallRequest;

          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {

              private static final int FILE_CHOOSER_REQUEST = 1001;
              private static final int CAMERA_PERMISSION_REQUEST = 1002;
              private static final int CREATE_FILE_REQUEST = 1003;

              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private String pendingFileContent = null;
              private SubjectSegmenter subjectSegmenter;
              private boolean stickerModelReady = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.setStatusBarColor(Color.rgb(242, 239, 224));
                  window.setNavigationBarColor(Color.rgb(242, 239, 224));

                  if (android.os.Build.VERSION.SDK_INT >= 23) {
                      window.getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR |
                          View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                      );
                  }

                  webView = new WebView(this);
                  webView.setFitsSystemWindows(true);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);
                  settings.setLoadWithOverviewMode(false);
                  settings.setUseWideViewPort(false);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams) {

                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                          }

                          MainActivity.this.filePathCallback = filePathCallback;

                          String[] acceptTypes = fileChooserParams.getAcceptTypes();
                          boolean wantsJson = false;

                          if (acceptTypes != null) {
                              for (String type : acceptTypes) {
                                  if (type == null) continue;
                                  String t = type.toLowerCase();
                                  if (t.contains("json") || t.contains(".json") || t.equals("application/json")) {
                                      wantsJson = true;
                                      break;
                                  }
                              }
                          }

                          if (wantsJson) {
                              Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              intent.setType("application/json");
                              intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, false);
                              try {
                                  startActivityForResult(intent, FILE_CHOOSER_REQUEST);
                              } catch (Exception e) {
                                  intent.setType("*/*");
                                  startActivityForResult(intent, FILE_CHOOSER_REQUEST);
                              }
                              return true;
                          }

                          Intent galleryIntent = new Intent(Intent.ACTION_GET_CONTENT);
                          galleryIntent.addCategory(Intent.CATEGORY_OPENABLE);
                          galleryIntent.setType("image/*");

                          Intent cameraIntent = null;
                          if (ContextCompat.checkSelfPermission(
                                  MainActivity.this,
                                  Manifest.permission.CAMERA
                          ) == PackageManager.PERMISSION_GRANTED) {
                              cameraIntent = new Intent(android.provider.MediaStore.ACTION_IMAGE_CAPTURE);
                          }

                          Intent chooserIntent;
                          if (cameraIntent != null) {
                              chooserIntent = new Intent(Intent.ACTION_CHOOSER);
                              chooserIntent.putExtra(Intent.EXTRA_INTENT, galleryIntent);
                              chooserIntent.putExtra(Intent.EXTRA_INITIAL_INTENTS, new Intent[]{cameraIntent});
                          } else {
                              chooserIntent = galleryIntent;
                          }

                          try {
                              startActivityForResult(chooserIntent, FILE_CHOOSER_REQUEST);
                          } catch (Exception e) {
                              MainActivity.this.filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  SubjectSegmenterOptions options =
                          new SubjectSegmenterOptions.Builder()
                                  .enableForegroundBitmap()
                                  .build();
                  subjectSegmenter = SubjectSegmentation.getClient(options);

                  // Explicitly ask Google Play services to install the subject-segmentation
                  // module before the first sticker request. This prevents the first request
                  // from failing while the model is still being downloaded.
                  ModuleInstall.getClient(this)
                          .installModules(ModuleInstallRequest.newBuilder()
                                  .addApi(subjectSegmenter)
                                  .build())
                          .addOnSuccessListener(response ->
                                  subjectSegmenter.getInitTask()
                                          .addOnSuccessListener(v -> stickerModelReady = true)
                                          .addOnFailureListener(e -> stickerModelReady = false))
                          .addOnFailureListener(e ->
                                  subjectSegmenter.getInitTask()
                                          .addOnSuccessListener(v -> stickerModelReady = true)
                                          .addOnFailureListener(err -> stickerModelReady = false));

                  webView.addJavascriptInterface(new AndroidBridge(), "Android");
                  webView.loadUrl("file:///android_asset/index.html");

                  if (ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.CAMERA
                  ) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(
                              this,
                              new String[]{Manifest.permission.CAMERA},
                              CAMERA_PERMISSION_REQUEST
                      );
                  }
              }

              private void sendStickerResult(String dataUrl) {
                  if (webView == null) return;
                  final String safe = dataUrl == null ? "" : dataUrl;
                  webView.post(() -> webView.evaluateJavascript(
                          "window.onStickerReady(" + JSONObject.quote(safe) + ");",
                          null
                  ));
              }

              private Bitmap makeStickerBitmap(Bitmap foreground) {
                  if (foreground == null) return null;

                  int w = foreground.getWidth();
                  int h = foreground.getHeight();
                  int[] pixels = new int[w * h];
                  foreground.getPixels(pixels, 0, w, 0, 0, w, h);

                  int left = w, top = h, right = -1, bottom = -1;
                  for (int y = 0; y < h; y++) {
                      int row = y * w;
                      for (int x = 0; x < w; x++) {
                          int a = Color.alpha(pixels[row + x]);
                          if (a > 12) {
                              if (x < left) left = x;
                              if (x > right) right = x;
                              if (y < top) top = y;
                              if (y > bottom) bottom = y;
                          }
                      }
                  }

                  if (right < left || bottom < top) return null;

                  int padCrop = Math.max(2, Math.min(12, Math.min(w, h) / 80));
                  left = Math.max(0, left - padCrop);
                  top = Math.max(0, top - padCrop);
                  right = Math.min(w - 1, right + padCrop);
                  bottom = Math.min(h - 1, bottom + padCrop);

                  Bitmap cropped = Bitmap.createBitmap(
                          foreground, left, top,
                          right - left + 1,
                          bottom - top + 1
                  );

                  int maxSide = 1100;
                  int max = Math.max(cropped.getWidth(), cropped.getHeight());
                  if (max > maxSide) {
                      float scale = (float) maxSide / max;
                      cropped = Bitmap.createScaledBitmap(
                              cropped,
                              Math.max(1, Math.round(cropped.getWidth() * scale)),
                              Math.max(1, Math.round(cropped.getHeight() * scale)),
                              true
                      );
                  }

                  int border = Math.max(12, Math.min(28, Math.round(Math.min(cropped.getWidth(), cropped.getHeight()) * 0.025f)));
                  Bitmap alpha = cropped.extractAlpha();
                  Bitmap out = Bitmap.createBitmap(
                          cropped.getWidth() + border * 2,
                          cropped.getHeight() + border * 2,
                          Bitmap.Config.ARGB_8888
                  );

                  Canvas canvas = new Canvas(out);
                  Paint white = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.FILTER_BITMAP_FLAG);
                  white.setColor(Color.WHITE);

                  int steps = 28;
                  for (int i = 0; i < steps; i++) {
                      double angle = (Math.PI * 2.0 * i) / steps;
                      float dx = (float) (Math.cos(angle) * border);
                      float dy = (float) (Math.sin(angle) * border);
                      canvas.drawBitmap(alpha, border + dx, border + dy, white);
                  }

                  canvas.drawBitmap(cropped, border, border, null);
                  alpha.recycle();
                  if (cropped != foreground) cropped.recycle();
                  return out;
              }

              private String bitmapToDataUrl(Bitmap bitmap) {
                  if (bitmap == null) return null;
                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  bitmap.compress(Bitmap.CompressFormat.PNG, 100, out);
                  bitmap.recycle();
                  return "data:image/png;base64," +
                          Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP);
              }

              public class AndroidBridge {

                  @JavascriptInterface
                  public void saveFile(String filename, String content) {
                      runOnUiThread(() -> {
                          pendingFileContent = content;
                          Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("application/json");
                          intent.putExtra(Intent.EXTRA_TITLE, filename);
                          startActivityForResult(intent, CREATE_FILE_REQUEST);
                      });
                  }

                  @JavascriptInterface
                  public void makeSticker(String dataUrl) {
                      try {
                          if (dataUrl == null) {
                              sendStickerResult("");
                              return;
                          }

                          String raw = dataUrl;
                          int comma = raw.indexOf(',');
                          if (comma >= 0) raw = raw.substring(comma + 1);
                          byte[] bytes = Base64.decode(raw, Base64.DEFAULT);
                          Bitmap input = BitmapFactory.decodeByteArray(bytes, 0, bytes.length);
                          if (input == null || subjectSegmenter == null) {
                              sendStickerResult("");
                              return;
                          }

                          InputImage image = InputImage.fromBitmap(input, 0);
                          // Always wait for model initialization. On first run this can include
                          // downloading the Google Play services subject-segmentation model.
                          subjectSegmenter.getInitTask()
                                  .addOnSuccessListener(v -> {
                                      stickerModelReady = true;
                                      subjectSegmenter.process(image)
                                  .addOnSuccessListener(result -> {
                                      try {
                                          Bitmap foreground = result.getForegroundBitmap();
                                          Bitmap sticker = makeStickerBitmap(foreground);
                                          String data = bitmapToDataUrl(sticker);
                                          sendStickerResult(data == null ? "" : data);
                                      } catch (Exception ex) {
                                          sendStickerResult("");
                                      } finally {
                                          input.recycle();
                                      }
                                  })
                                  .addOnFailureListener(e -> {
                                      input.recycle();
                                      sendStickerResult("");
                                  });
                                  })
                                  .addOnFailureListener(e -> {
                                      input.recycle();
                                      sendStickerResult("");
                                  });
                      } catch (Exception e) {
                          sendStickerResult("");
                      }
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == FILE_CHOOSER_REQUEST) {
                      if (filePathCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == RESULT_OK && data != null) {
                          Uri uri = data.getData();
                          if (uri != null) results = new Uri[]{uri};
                      }
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                      return;
                  }

                  if (requestCode == CREATE_FILE_REQUEST) {
                      if (resultCode == RESULT_OK && data != null && data.getData() != null && pendingFileContent != null) {
                          try {
                              OutputStream output = getContentResolver().openOutputStream(data.getData());
                              if (output != null) {
                                  output.write(pendingFileContent.getBytes(StandardCharsets.UTF_8));
                                  output.flush();
                                  output.close();
                              }
                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                      }
                      pendingFileContent = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  if (subjectSegmenter != null) subjectSegmenter.close();
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF

      - name: Add AndroidX dependency
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android-build/app/build.gradle")
          s = p.read_text()

          s += r'''

          dependencies {
              implementation 'androidx.core:core:1.15.0'
              implementation('com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1') {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }

          configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
          }
          '''

          p.write_text(s)
          PY

      - name: Build APK
        working-directory: android-build
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp android-build/app/build/outputs/apk/debug/app-debug.apk \
             output/future-APK-v19.15-sticker-segmentation.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: future-APK-v19.15-sticker-segmentation
          path: output/future-APK-v19.15-sticker-segmentation.apk
          if-no-files-found: error
