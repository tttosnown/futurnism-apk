      - name: Download local sticker model
        shell: bash
        run: |
          set -e
          mkdir -p android-build/app/src/main/assets
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://huggingface.co/CoderViking/birefnet-lite-onnx/resolve/main/birefnet-lite-1024.onnx?download=true" \
            -o android-build/app/src/main/assets/birefnet-lite-1024.onnx
          echo "50a57872cc739192446da2a934159f957c81af8b5a161dfda8e3daa51660ca67  android-build/app/src/main/assets/birefnet-lite-1024.onnx" | sha256sum -c -

      - name: Add Android dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android-build/app/build.gradle")
          s = p.read_text()
          s = s.replace("versionCode 23", "versionCode 25")
          s = s.replace("versionName '19.17'", "versionName '19.19-camera-fix'")
          s += """

          dependencies {
              implementation 'androidx.core:core:1.15.0'
              implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.29.0'
          }

          """
          p.write_text(s)
          PY

      - name: Build APK
        working-directory: android-build
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp android-build/app/build/outputs/apk/debug/app-debug.apk \
             output/future-APK-v19.19-birefnet-sticker.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: future-APK-v19.19-birefnet-sticker
          path: output/future-APK-v19.19-birefnet-sticker.apk
          if-no-files-found: error
