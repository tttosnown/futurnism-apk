name: Build future APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf android-build
          mkdir -p android-build/app/src/main/java/com/futurism/app
          mkdir -p android-build/app/src/main/assets
          mkdir -p android-build/app/src/main/res/drawable
          mkdir -p android-build/app/src/main/res/mipmap-hdpi
          mkdir -p android-build/app/src/main/res/mipmap-mdpi
          mkdir -p android-build/app/src/main/res/mipmap-xhdpi
          mkdir -p android-build/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-build/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android-build/app/src/main/res/xml

          cp index.html android-build/app/src/main/assets/index.html

          if [ -f manifest.json ]; then
            cp manifest.json android-build/app/src/main/assets/manifest.json
          fi

          if [ -f sw.js ]; then
            cp sw.js android-build/app/src/main/assets/sw.js
          fi

          if [ -f future-logo.png ]; then
            cp future-logo.png android-build/app/src/main/assets/future-logo.png
          fi

          if [ -d icons ]; then
            cp -r icons android-build/app/src/main/assets/
          fi

          if [ -f icon-192.png ]; then
            cp icon-192.png android-build/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp icon-192.png android-build/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icon-192.png android-build/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp icon-192.png android-build/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon-192.png android-build/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

          cat > android-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "future"
          include(":app")
          EOF

          cat > android-build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > android-build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android-build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.futurism.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.futurism.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 23
                  versionName '19.17'
              }
          }
          EOF

          mkdir -p android-build/app/src/main/res/values

          cat > android-build/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">future</string>
          </resources>
          EOF

          cat > android-build/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path
                  name="camera_cache"
                  path="." />
          </paths>
          EOF

          cat > android-build/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />

              <application
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <meta-data
                      android:name="com.google.mlkit.vision.DEPENDENCIES"
                      android:value="subject_segment" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

              </application>

          </manifest>
          EOF

          mkdir -p android-build/app/src/main/res/values

          cat > android-build/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#F7F3EE</item>
                  <item name="android:navigationBarColor">#F7F3EE</item>
                  <item name="android:windowLightNavigationBar">true</item>
                  <item name="android:colorAccent">#b9210c</item>
              </style>

          </resources>
          EOF

      - name: Create MainActivity
        shell: bash
        run: |
          cat > android-build/app/src/main/java/com/futurism/app/MainActivity.java <<'EOF'
          package com.futurism.app;
          
          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.res.AssetManager;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.net.Uri;
          import android.os.Bundle;
          import android.util.Base64;
          import android.view.View;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.content.FileProvider;
          
          import ai.onnxruntime.OnnxTensor;
          import ai.onnxruntime.OrtEnvironment;
          import ai.onnxruntime.OrtSession;
          
          import org.json.JSONObject;
          
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.nio.FloatBuffer;
          import java.nio.charset.StandardCharsets;
          import java.util.Collections;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          
          public class MainActivity extends Activity {
          
              private static final int FILE_CHOOSER_REQUEST = 1001;
              private static final int CAMERA_PERMISSION_REQUEST = 1002;
              private static final int CREATE_FILE_REQUEST = 1003;
          
              private static final int MODEL_SIZE = 1024;
              private static final int MAX_SOURCE_DIM = 1024;
              private static final String MODEL_ASSET = "birefnet-lite-1024.onnx";
          
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              // URI of the temporary photo file used when the camera is launched.
              // EXTRA_OUTPUT cameras often return a null Intent, so this must survive until onActivityResult.
              private Uri pendingCameraUri = null;
              private String pendingFileContent = null;
          
              private OrtEnvironment ortEnvironment;
              private OrtSession ortSession;
              private String inputName;
              private final ExecutorService stickerExecutor = Executors.newSingleThreadExecutor();
              private volatile boolean stickerBusy = false;
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
          
                  Window window = getWindow();
                  window.setStatusBarColor(Color.rgb(242, 239, 224));
                  window.setNavigationBarColor(Color.rgb(242, 239, 224));
                  if (android.os.Build.VERSION.SDK_INT >= 23) {
                      window.getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR |
                              View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                      );
                  }
          
                  webView = new WebView(this);
                  webView.setFitsSystemWindows(true);
                  setContentView(webView);
          
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);
                  settings.setLoadWithOverviewMode(false);
                  settings.setUseWideViewPort(false);
                  webView.setWebViewClient(new WebViewClient());
          
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams) {
          
                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                          }
                          MainActivity.this.filePathCallback = filePathCallback;
          
                          String[] acceptTypes = fileChooserParams.getAcceptTypes();
                          boolean wantsJson = false;
                          if (acceptTypes != null) {
                              for (String type : acceptTypes) {
                                  if (type == null) continue;
                                  String t = type.toLowerCase();
                                  if (t.contains("json") || t.contains(".json") || t.equals("application/json")) {
                                      wantsJson = true;
                                      break;
                                  }
                              }
                          }
          
                          if (wantsJson) {
                              Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              intent.setType("application/json");
                              intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, false);
                              try {
                                  startActivityForResult(intent, FILE_CHOOSER_REQUEST);
                              } catch (Exception e) {
                                  intent.setType("*/*");
                                  startActivityForResult(intent, FILE_CHOOSER_REQUEST);
                              }
                              return true;
                          }
          
                          Intent galleryIntent = new Intent(Intent.ACTION_GET_CONTENT);
                          galleryIntent.addCategory(Intent.CATEGORY_OPENABLE);
                          galleryIntent.setType("image/*");
          
                          Intent cameraIntent = null;
                          if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.CAMERA)
                                  == PackageManager.PERMISSION_GRANTED) {
                              try {
                                  File photoFile = File.createTempFile("future_camera_", ".jpg", getCacheDir());
                                  pendingCameraUri = FileProvider.getUriForFile(
                                          MainActivity.this,
                                          getPackageName() + ".fileprovider",
                                          photoFile
                                  );
                                  cameraIntent = new Intent(android.provider.MediaStore.ACTION_IMAGE_CAPTURE);
                                  cameraIntent.putExtra(android.provider.MediaStore.EXTRA_OUTPUT, pendingCameraUri);
                                  cameraIntent.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              } catch (Exception e) {
                                  pendingCameraUri = null;
                              }
                          }
          
                          Intent chooserIntent;
                          if (cameraIntent != null) {
                              chooserIntent = new Intent(Intent.ACTION_CHOOSER);
                              chooserIntent.putExtra(Intent.EXTRA_INTENT, galleryIntent);
                              chooserIntent.putExtra(Intent.EXTRA_INITIAL_INTENTS, new Intent[]{cameraIntent});
                          } else {
                              chooserIntent = galleryIntent;
                          }
          
                          try {
                              startActivityForResult(chooserIntent, FILE_CHOOSER_REQUEST);
                          } catch (Exception e) {
                              MainActivity.this.filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });
          
                  webView.addJavascriptInterface(new AndroidBridge(), "Android");
                  webView.loadUrl("file:///android_asset/index.html");
          
                  if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.CAMERA)
                          != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(
                              this,
                              new String[]{Manifest.permission.CAMERA},
                              CAMERA_PERMISSION_REQUEST
                      );
                  }
              }
          
              private void sendStickerResult(String dataUrl) {
                  if (webView == null) return;
                  final String safe = dataUrl == null ? "" : dataUrl;
                  webView.post(() -> webView.evaluateJavascript(
                          "window.onStickerReady(" + JSONObject.quote(safe) + ");",
                          null
                  ));
              }
          
              private void sendStickerError() {
                  sendStickerResult("");
              }
          
              private synchronized void ensureOrtSession() throws Exception {
                  if (ortSession != null) return;
          
                  File modelFile = new File(getFilesDir(), MODEL_ASSET);
                  if (!modelFile.exists() || modelFile.length() < 150_000_000L) {
                      AssetManager assets = getAssets();
                      File temp = new File(getFilesDir(), MODEL_ASSET + ".tmp");
                      if (temp.exists()) temp.delete();
                      try (InputStream in = assets.open(MODEL_ASSET, AssetManager.ACCESS_STREAMING);
                           OutputStream out = new FileOutputStream(temp)) {
                          byte[] buffer = new byte[1024 * 1024];
                          int n;
                          while ((n = in.read(buffer)) != -1) out.write(buffer, 0, n);
                          out.flush();
                      }
                      if (!temp.renameTo(modelFile)) {
                          if (modelFile.exists()) modelFile.delete();
                          if (!temp.renameTo(modelFile)) throw new Exception("无法准备贴纸模型");
                      }
                  }
          
                  ortEnvironment = OrtEnvironment.getEnvironment();
                  ortSession = ortEnvironment.createSession(modelFile.getAbsolutePath());
                  inputName = ortSession.getInputNames().iterator().next();
              }
          
              private Bitmap decodeInput(String dataUrl) throws Exception {
                  String raw = dataUrl;
                  int comma = raw.indexOf(',');
                  if (comma >= 0) raw = raw.substring(comma + 1);
                  byte[] bytes = Base64.decode(raw, Base64.DEFAULT);
          
                  BitmapFactory.Options bounds = new BitmapFactory.Options();
                  bounds.inJustDecodeBounds = true;
                  BitmapFactory.decodeByteArray(bytes, 0, bytes.length, bounds);
                  if (bounds.outWidth <= 0 || bounds.outHeight <= 0) return null;
          
                  int maxDim = Math.max(bounds.outWidth, bounds.outHeight);
                  int sample = 1;
                  while (maxDim / sample > MAX_SOURCE_DIM) sample *= 2;
          
                  BitmapFactory.Options opts = new BitmapFactory.Options();
                  opts.inSampleSize = sample;
                  opts.inPreferredConfig = Bitmap.Config.ARGB_8888;
                  Bitmap input = BitmapFactory.decodeByteArray(bytes, 0, bytes.length, opts);
                  if (input == null) return null;
          
                  int actualMax = Math.max(input.getWidth(), input.getHeight());
                  if (actualMax > MAX_SOURCE_DIM) {
                      float scale = MAX_SOURCE_DIM / (float) actualMax;
                      Bitmap scaled = Bitmap.createScaledBitmap(
                              input,
                              Math.max(1, Math.round(input.getWidth() * scale)),
                              Math.max(1, Math.round(input.getHeight() * scale)),
                              true
                      );
                      input.recycle();
                      input = scaled;
                  }
                  return input;
              }
          
              private Bitmap resizeForModel(Bitmap source) {
                  return Bitmap.createScaledBitmap(source, MODEL_SIZE, MODEL_SIZE, true);
              }
          
              private FloatBuffer bitmapToInputBuffer(Bitmap bitmap) {
                  ByteBuffer bytes = ByteBuffer.allocateDirect(1 * 3 * MODEL_SIZE * MODEL_SIZE * 4)
                          .order(ByteOrder.nativeOrder());
                  FloatBuffer buffer = bytes.asFloatBuffer();
          
                  int[] pixels = new int[MODEL_SIZE * MODEL_SIZE];
                  bitmap.getPixels(pixels, 0, MODEL_SIZE, 0, 0, MODEL_SIZE, MODEL_SIZE);
          
                  // NCHW, RGB, ImageNet normalization used by the exported BiRefNet model.
                  final float meanR = 0.485f, meanG = 0.456f, meanB = 0.406f;
                  final float stdR = 0.229f, stdG = 0.224f, stdB = 0.225f;
                  int plane = MODEL_SIZE * MODEL_SIZE;
                  for (int i = 0; i < plane; i++) {
                      int c = pixels[i];
                      float r = ((c >> 16) & 255) / 255f;
                      float g = ((c >> 8) & 255) / 255f;
                      float b = (c & 255) / 255f;
                      buffer.put(i, (r - meanR) / stdR);
                      buffer.put(plane + i, (g - meanG) / stdG);
                      buffer.put(plane * 2 + i, (b - meanB) / stdB);
                  }
                  return buffer;
              }
          
              private static float sigmoid(float x) {
                  if (x >= 0) {
                      double z = Math.exp(-x);
                      return (float) (1.0 / (1.0 + z));
                  } else {
                      double z = Math.exp(x);
                      return (float) (z / (1.0 + z));
                  }
              }
          
              private float[] runSegmentation(Bitmap source) throws Exception {
                  Bitmap modelBitmap = resizeForModel(source);
                  FloatBuffer inputBuffer = bitmapToInputBuffer(modelBitmap);
                  modelBitmap.recycle();
          
                  long[] shape = new long[]{1, 3, MODEL_SIZE, MODEL_SIZE};
                  float[] alpha = new float[MODEL_SIZE * MODEL_SIZE];
          
                  try (OnnxTensor tensor = OnnxTensor.createTensor(ortEnvironment, inputBuffer, shape);
                       OrtSession.Result result = ortSession.run(Collections.singletonMap(inputName, tensor))) {
                      OnnxTensor output = (OnnxTensor) result.get(0);
                      FloatBuffer out = output.getFloatBuffer();
                      out.rewind();
                      for (int i = 0; i < alpha.length && out.hasRemaining(); i++) {
                          alpha[i] = sigmoid(out.get());
                      }
                  }
                  return alpha;
              }
          
              private float sampleAlpha(float[] mask, int x, int y) {
                  x = Math.max(0, Math.min(MODEL_SIZE - 1, x));
                  y = Math.max(0, Math.min(MODEL_SIZE - 1, y));
                  return mask[y * MODEL_SIZE + x];
              }
          
              private float sampleBilinear(float[] mask, float fx, float fy) {
                  fx = Math.max(0f, Math.min(MODEL_SIZE - 1f, fx));
                  fy = Math.max(0f, Math.min(MODEL_SIZE - 1f, fy));
                  int x0 = (int) Math.floor(fx);
                  int y0 = (int) Math.floor(fy);
                  int x1 = Math.min(MODEL_SIZE - 1, x0 + 1);
                  int y1 = Math.min(MODEL_SIZE - 1, y0 + 1);
                  float dx = fx - x0;
                  float dy = fy - y0;
                  float a = sampleAlpha(mask, x0, y0);
                  float b = sampleAlpha(mask, x1, y0);
                  float c = sampleAlpha(mask, x0, y1);
                  float d = sampleAlpha(mask, x1, y1);
                  return a * (1-dx) * (1-dy) + b * dx * (1-dy) + c * (1-dx) * dy + d * dx * dy;
              }
          
              private Bitmap makeStickerBitmap(Bitmap source, float[] modelMask) {
                  int w = source.getWidth();
                  int h = source.getHeight();
                  int[] src = new int[w * h];
                  source.getPixels(src, 0, w, 0, 0, w, h);
          
                  int[] outPixels = new int[w * h];
                  boolean[] keep = new boolean[w * h];
          
                  // Recall-first mask: a lower threshold intentionally keeps a little extra
                  // around hair, hands and clothing rather than cutting them away.
                  final float KEEP_THRESHOLD = 0.16f;
                  for (int y = 0; y < h; y++) {
                      float my = (y + 0.5f) * MODEL_SIZE / h - 0.5f;
                      for (int x = 0; x < w; x++) {
                          float mx = (x + 0.5f) * MODEL_SIZE / w - 0.5f;
                          float p = sampleBilinear(modelMask, mx, my);
                          keep[y * w + x] = p >= KEEP_THRESHOLD;
                      }
                  }
          
                  // Close tiny gaps, then expand the silhouette a little. This is deliberate:
                  // the app should prefer a slightly loose sticker to a sticker missing fingers,
                  // hair, shoulders or clothing.
                  boolean[] closed = new boolean[w * h];
                  for (int pass = 0; pass < 2; pass++) {
                      for (int y = 0; y < h; y++) {
                          for (int x = 0; x < w; x++) {
                              boolean value = keep[y * w + x];
                              if (!value) {
                                  int count = 0;
                                  for (int dy = -1; dy <= 1; dy++) {
                                      for (int dx = -1; dx <= 1; dx++) {
                                          int xx = x + dx, yy = y + dy;
                                          if (xx >= 0 && xx < w && yy >= 0 && yy < h && keep[yy * w + xx]) count++;
                                      }
                                  }
                                  value = count >= 5;
                              }
                              closed[y * w + x] = value;
                          }
                      }
                      boolean[] tmp = keep;
                      keep = closed;
                      closed = tmp;
                  }
          
                  int dilate = Math.max(2, Math.min(5, Math.round(Math.min(w, h) * 0.004f)));
                  boolean[] expanded = new boolean[w * h];
                  for (int y = 0; y < h; y++) {
                      for (int x = 0; x < w; x++) {
                          boolean value = false;
                          outer:
                          for (int dy = -dilate; dy <= dilate; dy++) {
                              int yy = y + dy;
                              if (yy < 0 || yy >= h) continue;
                              for (int dx = -dilate; dx <= dilate; dx++) {
                                  int xx = x + dx;
                                  if (xx < 0 || xx >= w) continue;
                                  if (keep[yy * w + xx]) {
                                      value = true;
                                      break outer;
                                  }
                              }
                          }
                          expanded[y * w + x] = value;
                      }
                  }
          
                  int left = w, top = h, right = -1, bottom = -1;
                  for (int y = 0; y < h; y++) {
                      for (int x = 0; x < w; x++) {
                          int idx = y * w + x;
                          if (!expanded[idx]) {
                              outPixels[idx] = src[idx] & 0x00FFFFFF;
                              continue;
                          }
                          float mx = (x + 0.5f) * MODEL_SIZE / w - 0.5f;
                          float my = (y + 0.5f) * MODEL_SIZE / h - 0.5f;
                          float p = sampleBilinear(modelMask, mx, my);
                          // Keep soft edges but never let the low recall threshold become a hard halo.
                          float a = Math.max(0f, Math.min(1f, (p - 0.08f) / 0.82f));
                          if (p < KEEP_THRESHOLD) a = Math.max(a, 0.16f);
                          int ai = Math.max(12, Math.min(255, Math.round(a * 255f)));
                          outPixels[idx] = (ai << 24) | (src[idx] & 0x00FFFFFF);
                          if (ai > 12) {
                              if (x < left) left = x;
                              if (x > right) right = x;
                              if (y < top) top = y;
                              if (y > bottom) bottom = y;
                          }
                      }
                  }
          
                  if (right < left || bottom < top) return null;
          
                  Bitmap masked = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                  masked.setPixels(outPixels, 0, w, 0, 0, w, h);
                  int padCrop = Math.max(3, Math.min(16, Math.min(w, h) / 70));
                  left = Math.max(0, left - padCrop);
                  top = Math.max(0, top - padCrop);
                  right = Math.min(w - 1, right + padCrop);
                  bottom = Math.min(h - 1, bottom + padCrop);
          
                  Bitmap cropped = Bitmap.createBitmap(masked, left, top, right - left + 1, bottom - top + 1);
                  masked.recycle();
                  if (cropped.getWidth() > 1000 || cropped.getHeight() > 1000) {
                      float scale = 1000f / Math.max(cropped.getWidth(), cropped.getHeight());
                      Bitmap scaled = Bitmap.createScaledBitmap(
                              cropped,
                              Math.max(1, Math.round(cropped.getWidth() * scale)),
                              Math.max(1, Math.round(cropped.getHeight() * scale)),
                              true
                      );
                      cropped.recycle();
                      cropped = scaled;
                  }
          
                  int border = Math.max(12, Math.min(30, Math.round(Math.min(cropped.getWidth(), cropped.getHeight()) * 0.028f)));
                  Bitmap alpha = cropped.extractAlpha();
                  Bitmap out = Bitmap.createBitmap(
                          cropped.getWidth() + border * 2,
                          cropped.getHeight() + border * 2,
                          Bitmap.Config.ARGB_8888
                  );
                  Canvas canvas = new Canvas(out);
                  Paint white = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.FILTER_BITMAP_FLAG);
                  white.setColor(Color.WHITE);
                  int steps = 32;
                  for (int i = 0; i < steps; i++) {
                      double angle = (Math.PI * 2.0 * i) / steps;
                      float dx = (float) (Math.cos(angle) * border);
                      float dy = (float) (Math.sin(angle) * border);
                      canvas.drawBitmap(alpha, border + dx, border + dy, white);
                  }
                  canvas.drawBitmap(cropped, border, border, null);
                  alpha.recycle();
                  cropped.recycle();
                  return out;
              }
          
              private String bitmapToDataUrl(Bitmap bitmap) {
                  if (bitmap == null) return null;
                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  bitmap.compress(Bitmap.CompressFormat.PNG, 100, out);
                  bitmap.recycle();
                  return "data:image/png;base64," + Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP);
              }
          
              public class AndroidBridge {
                  @JavascriptInterface
                  public void saveFile(String filename, String content) {
                      runOnUiThread(() -> {
                          pendingFileContent = content;
                          Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("application/json");
                          intent.putExtra(Intent.EXTRA_TITLE, filename);
                          startActivityForResult(intent, CREATE_FILE_REQUEST);
                      });
                  }
          
                  @JavascriptInterface
                  public void makeSticker(String dataUrl) {
                      if (stickerBusy) return;
                      if (dataUrl == null || dataUrl.length() < 100) {
                          sendStickerError();
                          return;
                      }
                      stickerBusy = true;
                      stickerExecutor.execute(() -> {
                          Bitmap source = null;
                          Bitmap sticker = null;
                          try {
                              ensureOrtSession();
                              source = decodeInput(dataUrl);
                              if (source == null) throw new Exception("图片读取失败");
                              float[] mask = runSegmentation(source);
                              sticker = makeStickerBitmap(source, mask);
                              if (sticker == null) throw new Exception("没有得到有效主体");
                              String result = bitmapToDataUrl(sticker);
                              sticker = null;
                              sendStickerResult(result == null ? "" : result);
                          } catch (OutOfMemoryError oom) {
                              sendStickerError();
                          } catch (Throwable t) {
                              sendStickerError();
                          } finally {
                              if (sticker != null && !sticker.isRecycled()) sticker.recycle();
                              if (source != null && !source.isRecycled()) source.recycle();
                              stickerBusy = false;
                          }
                      });
                  }
              }
          
              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_REQUEST) {
                      if (filePathCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == RESULT_OK) {
                          // Camera launched with EXTRA_OUTPUT returns no data Intent on many phones.
                          // Use the saved FileProvider URI in that case.
                          Uri uri = (data != null && data.getData() != null) ? data.getData() : pendingCameraUri;
                          if (uri != null) results = new Uri[]{uri};
                      }
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                      if (resultCode != RESULT_OK && pendingCameraUri != null) {
                          try {
                              File f = new File(pendingCameraUri.getPath());
                              if (f.exists()) f.delete();
                          } catch (Exception ignored) {}
                      }
                      pendingCameraUri = null;
                      return;
                  }
                  if (requestCode == CREATE_FILE_REQUEST) {
                      if (resultCode == RESULT_OK && data != null && data.getData() != null && pendingFileContent != null) {
                          try (OutputStream output = getContentResolver().openOutputStream(data.getData())) {
                              if (output != null) {
                                  output.write(pendingFileContent.getBytes(StandardCharsets.UTF_8));
                                  output.flush();
                              }
                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                      }
                      pendingFileContent = null;
                  }
              }
          
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          
              @Override
              protected void onDestroy() {
                  stickerExecutor.shutdownNow();
                  if (ortSession != null) {
                      try { ortSession.close(); } catch (Exception ignored) {}
                      ortSession = null;
                  }
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
