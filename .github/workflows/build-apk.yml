name: Build future APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf android-build
          mkdir -p android-build/app/src/main/java/com/futurism/app
          mkdir -p android-build/app/src/main/assets
          mkdir -p android-build/app/src/main/res/drawable
          mkdir -p android-build/app/src/main/res/mipmap-hdpi
          mkdir -p android-build/app/src/main/res/mipmap-mdpi
          mkdir -p android-build/app/src/main/res/mipmap-xhdpi
          mkdir -p android-build/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-build/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android-build/app/src/main/res/xml

          cp index.html android-build/app/src/main/assets/index.html

          if [ -f manifest.json ]; then
            cp manifest.json android-build/app/src/main/assets/manifest.json
          fi

          if [ -f sw.js ]; then
            cp sw.js android-build/app/src/main/assets/sw.js
          fi

          if [ -d icons ]; then
            cp -r icons android-build/app/src/main/assets/
          fi

          if [ -f icon-192.png ]; then
            cp icon-192.png android-build/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp icon-192.png android-build/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icon-192.png android-build/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp icon-192.png android-build/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon-192.png android-build/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

          cat > android-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "future"
          include(":app")
          EOF

          cat > android-build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > android-build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android-build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.futurism.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.futurism.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.3'
              }
          }
          EOF

          cat > android-build/app/src/main/res/values.xml <<'EOF'
          EOF

          mkdir -p android-build/app/src/main/res/values

          cat > android-build/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">future</string>
          </resources>
          EOF

          cat > android-build/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path
                  name="camera_cache"
                  path="." />
          </paths>
          EOF

          cat > android-build/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />

              <application
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

              </application>

          </manifest>
          EOF

          mkdir -p android-build/app/src/main/res/values

          cat > android-build/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#F7F3EE</item>
                  <item name="android:navigationBarColor">#F7F3EE</item>
                  <item name="android:windowLightNavigationBar">true</item>
                  <item name="android:colorAccent">#777777</item>
              </style>

          </resources>
          EOF

      - name: Create MainActivity
        shell: bash
        run: |
          cat > android-build/app/src/main/java/com/futurism/app/MainActivity.java <<'EOF'
          package com.futurism.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.View;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceRequest;

          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.content.FileProvider;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {

              private static final int FILE_CHOOSER_REQUEST = 1001;
              private static final int CAMERA_PERMISSION_REQUEST = 1002;
              private static final int CREATE_FILE_REQUEST = 1003;

              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private String pendingFileContent = null;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();

                  window.setStatusBarColor(Color.rgb(247, 243, 238));
                  window.setNavigationBarColor(Color.rgb(247, 243, 238));

                  if (android.os.Build.VERSION.SDK_INT >= 23) {
                      window.getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR |
                          View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                      );
                  }

                  if (android.os.Build.VERSION.SDK_INT >= 30) {
                      window.setDecorFitsSystemWindows(true);
                  }

                  webView = new WebView(this);
                  webView.setFitsSystemWindows(true);

                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);
                  settings.setLoadWithOverviewMode(false);
                  settings.setUseWideViewPort(false);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {
                          return false;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams) {

                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                          }

                          MainActivity.this.filePathCallback = filePathCallback;

                          String[] acceptTypes =
                                  fileChooserParams.getAcceptTypes();

                          boolean wantsJson = false;

                          if (acceptTypes != null) {
                              for (String type : acceptTypes) {
                                  if (type == null) continue;

                                  String t = type.toLowerCase();

                                  if (t.contains("json")
                                          || t.contains(".json")
                                          || t.equals("application/json")) {
                                      wantsJson = true;
                                      break;
                                  }
                              }
                          }

                          /*
                           * JSON 导入：
                           * 直接打开 Android 系统文件选择器。
                           * 不再使用 image/*。
                           */
                          if (wantsJson) {

                              Intent intent = new Intent(
                                      Intent.ACTION_OPEN_DOCUMENT
                              );

                              intent.addCategory(
                                      Intent.CATEGORY_OPENABLE
                              );

                              intent.setType("application/json");

                              intent.putExtra(
                                      Intent.EXTRA_ALLOW_MULTIPLE,
                                      false
                              );

                              try {
                                  startActivityForResult(
                                          intent,
                                          FILE_CHOOSER_REQUEST
                                  );
                              } catch (Exception e) {

                                  intent.setType("*/*");

                                  startActivityForResult(
                                          intent,
                                          FILE_CHOOSER_REQUEST
                                  );
                              }

                              return true;
                          }

                          /*
                           * 图片：
                           * 保留原来的相机 + 相册功能。
                           */
                          Intent galleryIntent = new Intent(
                                  Intent.ACTION_GET_CONTENT
                          );

                          galleryIntent.addCategory(
                                  Intent.CATEGORY_OPENABLE
                          );

                          galleryIntent.setType("image/*");

                          Intent cameraIntent = null;

                          if (ContextCompat.checkSelfPermission(
                                  MainActivity.this,
                                  Manifest.permission.CAMERA
                          ) == PackageManager.PERMISSION_GRANTED) {

                              cameraIntent = new Intent(
                                      android.provider.MediaStore.ACTION_IMAGE_CAPTURE
                              );
                          }

                          Intent chooserIntent;

                          if (cameraIntent != null) {
                              chooserIntent = new Intent(
                                      Intent.ACTION_CHOOSER
                              );

                              chooserIntent.putExtra(
                                      Intent.EXTRA_INTENT,
                                      galleryIntent
                              );

                              chooserIntent.putExtra(
                                      Intent.EXTRA_INITIAL_INTENTS,
                                      new Intent[]{cameraIntent}
                              );
                          } else {
                              chooserIntent = galleryIntent;
                          }

                          try {
                              startActivityForResult(
                                      chooserIntent,
                                      FILE_CHOOSER_REQUEST
                              );
                          } catch (Exception e) {
                              MainActivity.this.filePathCallback = null;
                              return false;
                          }

                          return true;
                      }
                  });

                  webView.addJavascriptInterface(
                          new AndroidBridge(),
                          "Android"
                  );

                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );

                  if (ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.CAMERA
                  ) != PackageManager.PERMISSION_GRANTED) {

                      ActivityCompat.requestPermissions(
                              this,
                              new String[]{Manifest.permission.CAMERA},
                              CAMERA_PERMISSION_REQUEST
                      );
                  }
              }

              public class AndroidBridge {

                  @JavascriptInterface
                  public void saveFile(
                          String filename,
                          String content) {

                      runOnUiThread(() -> {

                          pendingFileContent = content;

                          Intent intent = new Intent(
                                  Intent.ACTION_CREATE_DOCUMENT
                          );

                          intent.addCategory(
                                  Intent.CATEGORY_OPENABLE
                          );

                          intent.setType("application/json");

                          intent.putExtra(
                                  Intent.EXTRA_TITLE,
                                  filename
                          );

                          startActivityForResult(
                                  intent,
                                  CREATE_FILE_REQUEST
                          );
                      });
                  }
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if (requestCode == FILE_CHOOSER_REQUEST) {

                      if (filePathCallback == null) {
                          return;
                      }

                      Uri[] results = null;

                      if (resultCode == RESULT_OK && data != null) {

                          Uri uri = data.getData();

                          if (uri != null) {
                              results = new Uri[]{uri};
                          }
                      }

                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;

                      return;
                  }

                  if (requestCode == CREATE_FILE_REQUEST) {

                      if (resultCode == RESULT_OK
                              && data != null
                              && data.getData() != null
                              && pendingFileContent != null) {

                          Uri uri = data.getData();

                          try {

                              OutputStream output =
                                      getContentResolver()
                                              .openOutputStream(uri);

                              if (output != null) {

                                  output.write(
                                          pendingFileContent.getBytes(
                                                  StandardCharsets.UTF_8
                                          )
                                  );

                                  output.flush();
                                  output.close();
                              }

                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                      }

                      pendingFileContent = null;
                  }
              }

              @Override
              public void onBackPressed() {

                  if (webView != null
                          && webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {

                  if (webView != null) {
                      webView.destroy();
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Add AndroidX dependency
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android-build/app/build.gradle")
          s = p.read_text()

          s += r'''

          dependencies {
              implementation 'androidx.core:core:1.15.0'
          }
          '''

          p.write_text(s)
          PY

      - name: Build APK
        working-directory: android-build
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp android-build/app/build/outputs/apk/debug/app-debug.apk \
             output/Futurism-APK-v1.3-json-import-fix.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Futurism-APK-v1.3-json-import-fix
          path: output/Futurism-APK-v1.3-json-import-fix.apk
          if-no-files-found: error
