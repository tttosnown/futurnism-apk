<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2efe0">
<title>future</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="future">
<link rel="icon" href="icon-192.png">

<style>
*{box-sizing:border-box}
:root{--palette-red:#b9210c;--palette-cream:#f2efe0;--palette-yellow:#f9d991;--palette-blue:#c9ddf5;--ink:#38556b;--ink-soft:#667789}
body{
 margin:0;
 background:#f3f0f8;
 color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;
 transition:background 1.2s ease;
}
button,input,textarea{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
button:focus{outline:none}
button,input,textarea{ -webkit-tap-highlight-color:transparent }

.app{
 max-width:760px;
 margin:auto;
 min-height:100vh;
 padding-bottom:88px;
}

header{
 padding:28px 22px 18px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 font-size:27px;
 font-weight:650;
 letter-spacing:-.04em;
}

.sub{
 font-size:12px;
 opacity:.45;
}

.page{
 display:none;
 padding:0 18px;
 opacity:0;
 transform:translateY(3px);
 pointer-events:none;
 transition:opacity .16s ease,transform .16s ease;
}

.page.active{
 display:block;
 opacity:1;
 transform:translateY(0);
 pointer-events:auto;
}

.card{
 background:rgba(242,239,224,.94);
 border:1px solid rgba(201,221,245,.72);
 border-radius:24px;
 padding:22px;
 margin-bottom:14px;
 box-shadow:0 5px 22px rgba(56,85,107,.08);
 background-image:radial-gradient(rgba(56,85,107,.055) .7px,transparent .7px);
 background-size:8px 8px;
}

.label{
 font-size:11px;
 letter-spacing:.1em;
 text-transform:uppercase;
 opacity:.42;
 margin-bottom:12px;
}

.date{
 font-size:13px;
 opacity:.5;
 margin-bottom:14px;
}

.memory-title{
 font-size:23px;
 line-height:1.25;
 margin-bottom:16px;
}

.memory-text{
 font-size:16px;
 line-height:1.7;
 white-space:pre-wrap;
 word-break:break-word;
}

.empty{
 padding:48px 20px;
 text-align:center;
 opacity:.45;
}

.today{
 margin-top:28px;
}

.today textarea{
 width:100%;
 min-height:110px;
 border:0;
 outline:0;
 resize:vertical;
 background:rgba(201,221,245,.34);
 border-radius:18px;
 padding:16px;
}

.actions{
 display:flex;
 gap:10px;
 margin-top:12px;
}

.pill{
 padding:11px 15px;
 border-radius:999px;
 background:var(--palette-red);
 color:#fff;
 font-size:13px;
}

.pill.light{
 background:var(--palette-blue);
 color:var(--ink);
}

.bottom{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:min(760px,100%);
 padding:10px 18px calc(10px + env(safe-area-inset-bottom));
 background:linear-gradient(to top,rgba(242,239,224,.92),rgba(242,239,224,.22));
 backdrop-filter:blur(18px);
 display:flex;
 gap:8px;
 z-index:4;
 transition:background 1.2s ease;
}

.nav{
 flex:1;
 padding:13px;
 border-radius:16px;
 font-size:14px;
}

.nav.active{
 background:var(--palette-blue);
 color:var(--ink);
}

.monthbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:8px 3px 18px;
}

.month{
 font-size:22px;
 font-weight:600;
}

.arrow{
 width:40px;
 height:40px;
 border-radius:50%;
 background:var(--palette-cream);
 border:1px solid rgba(56,85,107,.12);
 font-size:22px;
}

.week,
.calendar{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:6px;
}

.week div{
 text-align:center;
 font-size:10px;
 opacity:.35;
 padding-bottom:5px;
}

.day{
 min-height:72px;
 background:rgba(242,239,224,.86);
 border:1px solid rgba(201,221,245,.7);
 border-radius:13px;
 padding:8px;
 position:relative;
 overflow:hidden;
}

.day.other{
 opacity:.28;
}

.daynum{
 font-size:11px;
 opacity:.5;
 position:relative;
 z-index:2;
}

.mark{
 position:absolute;
 right:7px;
 bottom:7px;
 width:7px;
 height:7px;
 border-radius:50%;
 background:var(--palette-red);
}

.thumb{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
 opacity:.72;
}

.day.hasphoto .daynum{
 background:#fff;
 border-radius:8px;
 padding:2px 4px;
 width:max-content;
}

.overlay{
 display:none;
 position:fixed;
 inset:0;
 background:#00000045;
 z-index:5;
 align-items:flex-end;
 opacity:0;
 transition:opacity .16s ease;
}

.overlay.show{
 display:flex;
 opacity:1;
}

.sheet{
 width:100%;
 max-width:760px;
 margin:auto;
 background:var(--palette-cream);
 border:1px solid rgba(201,221,245,.8);
 border-radius:28px 28px 0 0;
 padding:20px 18px calc(24px + env(safe-area-inset-bottom));
 max-height:88vh;
 overflow:auto;
 transform:translateY(12px);
 opacity:.96;
 transition:transform .18s ease,opacity .18s ease;
}

.overlay.show .sheet{
 transform:translateY(0);
 opacity:1;
}

.sheethead{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:18px;
}

.close{
 font-size:25px;
 width:38px;
 height:38px;
 border-radius:50%;
 background:var(--palette-blue);
}

.field{
 margin-bottom:12px;
}

.field input,
.field textarea{
 width:100%;
 border:0;
 background:rgba(201,221,245,.3);
 border-radius:16px;
 padding:13px;
 outline:0;
}

.field textarea{
 min-height:130px;
 resize:vertical;
}

.preview{
 max-height:300px;
 width:100%;
 object-fit:cover;
 border-radius:18px;
 margin:8px 0;
}

.record-list .card{
 padding:17px;
}

.small-actions{
 display:flex;
 gap:8px;
 margin-top:12px;
}

.small-actions button{
 font-size:12px;
 padding:8px 12px;
 border-radius:999px;
 background:var(--palette-blue);
}

.iconbtn{
 width:38px;
 height:38px;
 border-radius:50%;
 display:inline-flex;
 align-items:center;
 justify-content:center;
 background:var(--palette-yellow);
 color:var(--ink);
 padding:0;
}

.iconbtn.dark{
 background:var(--palette-red);
 color:#fff;
}

.iconbtn svg{
 width:18px;
 height:18px;
 stroke:currentColor;
 fill:none;
 stroke-width:1.8;
 stroke-linecap:round;
 stroke-linejoin:round;
}

.iconrow{
 display:flex;
 gap:8px;
 margin-top:12px;
}

.more{
 width:40px;
 height:40px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:3px;
 background:rgba(242,239,224,.86);
}

.more span{
 width:3px;
 height:3px;
 background:#111;
 border-radius:50%;
}

.setting-row{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:17px 4px;
 border-bottom:1px solid #eee;
 cursor:pointer;
}

.setting-row:last-of-type{
 border-bottom:0;
}

.setting-name{
 font-size:15px;
}

.setting-desc{
 font-size:11px;
 opacity:.42;
 margin-top:4px;
}

.setting-row>svg{
 width:21px;
 height:21px;
 stroke:var(--ink);
 fill:none;
 stroke-width:1.7;
 stroke-linecap:round;
 stroke-linejoin:round;
}

/* 照片贴纸模式 */
.photo-mode{display:none;margin:12px 0 2px;padding:15px;border-radius:20px;background:rgba(201,221,245,.34);border:1px solid rgba(56,85,107,.08)}
.photo-mode.show{display:block}
.photo-mode-title{font-size:14px;font-weight:650;margin-bottom:10px}
.photo-mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-mode-btn{padding:13px 10px;border-radius:16px;background:rgba(242,239,224,.95);border:1px solid rgba(56,85,107,.14);color:var(--ink);font-size:14px}
.photo-mode-btn.active{background:var(--palette-blue);border-color:rgba(56,85,107,.25);font-weight:650}
.photo-mode-btn.sticker.active{box-shadow:inset 0 0 0 2px rgba(249,217,145,.8)}
.photo-mode-hint{font-size:11px;line-height:1.55;opacity:.58;margin-top:9px}
.sticker-preview{background:rgba(201,221,245,.22)!important;object-fit:contain!important;padding:12px}
.processing{display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-size:12px}
.processing:before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid rgba(56,85,107,.2);border-top-color:var(--palette-red);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 大型每月玻璃贴纸罐 */
.jar-card{background:rgba(242,239,224,.82);border:1px solid rgba(201,221,245,.9);padding:16px;overflow:hidden}
.jar-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.jar-week{font-size:16px;font-weight:650;color:var(--ink)}
 .jar-mini-cal{margin:8px 0 14px;padding:10px 11px;border-radius:16px;background:rgba(249,217,145,.18);border:1px solid rgba(201,221,245,.65)}
 .jar-mini-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
 .jar-mini-title{font-size:13px;font-weight:650}
 .jar-mini-head button{padding:4px 9px;border-radius:999px;background:rgba(201,221,245,.65);color:var(--ink);font-size:13px}
 .jar-mini-week,.jar-mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
 .jar-mini-week div{text-align:center;font-size:9px;opacity:.42;padding-bottom:3px}
 .jar-mini-day{min-height:27px;border-radius:8px;background:rgba(242,239,224,.72);border:1px solid rgba(201,221,245,.45);font-size:10px;color:var(--ink)}
 .jar-mini-day.muted{opacity:.22;background:transparent;border-color:transparent}
 .jar-mini-day.selected{background:var(--palette-blue);font-weight:700}
 .jar-mini-day.today{box-shadow:inset 0 0 0 1px var(--palette-red)}
.jar-count{font-size:11px;opacity:.55}
.jar-wrap{position:relative;width:100%;height:min(70vh,620px);min-height:430px;border-radius:42px 42px 48px 48px;background:linear-gradient(135deg,rgba(255,255,255,.42),rgba(201,221,245,.17) 42%,rgba(255,255,255,.28));border:2px solid rgba(255,255,255,.78);box-shadow:inset 0 0 0 1px rgba(56,85,107,.08),inset 0 18px 30px rgba(255,255,255,.3),0 16px 32px rgba(56,85,107,.1);overflow:hidden}
.jar-neck{position:absolute;left:18%;right:18%;top:-5px;height:42px;border-radius:0 0 22px 22px;background:linear-gradient(90deg,rgba(255,255,255,.38),rgba(201,221,245,.28),rgba(255,255,255,.42));border:2px solid rgba(255,255,255,.75);border-top:0}
.jar-glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,rgba(255,255,255,.3),transparent 22%,transparent 74%,rgba(255,255,255,.22));}
.jar-highlight{position:absolute;left:12px;top:58px;width:10px;height:62%;border-radius:99px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.03));opacity:.65}
.jar-sticker{position:absolute;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(56,85,107,.13));transform-origin:center;user-select:none;animation:jarDrop .48s cubic-bezier(.2,.9,.25,1.2) both}@keyframes jarDrop{0%{opacity:0;transform:translateY(-45px) rotate(-5deg) scale(.84)}100%{opacity:1;transform:translateY(0) rotate(var(--r)) scale(1)}}
.jar-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink);opacity:.42;font-size:13px;padding:40px}
.jar-nav{display:flex;align-items:center;gap:8px}
.jar-nav button{padding:9px 13px;border-radius:999px;background:var(--palette-blue);color:var(--ink);font-size:12px}
.jar-nav button.current{background:var(--palette-yellow)}
/* 时间背景 */
body.time-morning{
 background:linear-gradient(135deg,#edf7fc 0%,#f7fbfd 50%,#eaf5fb 100%);
}

body.time-day{
 background:linear-gradient(135deg,#fff8ed 0%,#fffaf4 50%,#fff0dc 100%);
}

body.time-evening{
 background:linear-gradient(135deg,#fff1f3 0%,#fff8f8 50%,#fbecef 100%);
}

body.time-night{
 background:linear-gradient(135deg,#f4eef9 0%,#f8f4fb 50%,#eee8f5 100%);
}

body.time-late{
 background:linear-gradient(135deg,#f0f1f2 0%,#f7f7f7 50%,#e9eaec 100%);
}

/* 文字 + 图片左右布局 */
.media-layout{
 display:grid;
 grid-template-columns:minmax(0,1fr) minmax(0,2fr);
 gap:16px;
 align-items:center;
 margin-top:2px;
}

.media-layout .memory-text{
 min-width:0;
 word-break:break-word;
}

.media-layout .photo{
 width:100%;
 height:220px;
 max-height:320px;
 object-fit:cover;
 margin:0;
 cursor:zoom-in;
 border-radius:18px;
 display:block;
}

.photo{
 width:100%;
 border-radius:18px;
 display:block;
 margin:0 0 15px;
 max-height:420px;
 object-fit:cover;
}

.photo-only{
 cursor:zoom-in;
}

/* 图片放大层 */
.image-lightbox{
 display:none;
 position:fixed;
 inset:0;
 z-index:20;
 background:rgba(0,0,0,.86);
 align-items:center;
 justify-content:center;
 padding:22px;
 opacity:0;
 transition:opacity .18s ease;
}

.image-lightbox.show{
 display:flex;
 opacity:1;
}

.image-lightbox img{
 max-width:100%;
 max-height:100%;
 object-fit:contain;
 border-radius:12px;
}

@media(max-width:430px){
 .media-layout{
  grid-template-columns:minmax(0,1fr) minmax(0,2fr);
  gap:12px;
 }

 .media-layout .photo{
  height:190px;
 }

 .media-layout .memory-text{
  font-size:14px;
  line-height:1.6;
 }
}

#startupSplash{position:fixed;inset:0;z-index:9999;background:#f3f0f8;display:flex;align-items:center;justify-content:center;transition:opacity .2s ease}#startupSplash.hide{opacity:0;pointer-events:none}.startupSplashTitle{font-size:24px;letter-spacing:.02em;font-weight:500;color:#17151a}
</style>
</head>

<body>

<div id="startupSplash" aria-label="future 启动封面"><div class="startupSplashTitle">future</div></div>

<div class="app">

<header>
 <div>
  <div class="logo">future</div>
  <div class="sub">a little message from yourself</div>
 </div>

 <button class="more" onclick="openSettings()" aria-label="设置" title="设置">
  <span></span><span></span><span></span>
 </button>
</header>

<main id="chance" class="page active">

 <section id="memory"></section>

 <section class="card today">
  <div class="label">TODAY</div>
  <div class="memory-title">今天，想留下一点什么？</div>

  <textarea
   id="todayText"
   placeholder="写下一句话，或者留一张照片。"
  ></textarea>

  <div class="actions">
   <button class="pill" onclick="saveToday()">留下</button>
   <button class="pill light" onclick="openEditor()">添加照片</button>
  </div>
 </section>

 <section id="recent" class="record-list"></section>

</main>

<main id="calendar" class="page">

 <div class="monthbar">
  <button class="arrow" onclick="changeMonth(-1)">‹</button>
  <div class="month" id="monthTitle"></div>
  <button class="arrow" onclick="changeMonth(1)">›</button>
 </div>

 <div class="week">
  <div>一</div>
  <div>二</div>
  <div>三</div>
  <div>四</div>
  <div>五</div>
  <div>六</div>
  <div>日</div>
 </div>

 <div id="cal" class="calendar"></div>

</main>

<main id="jar" class="page">
 <section class="card jar-card">
  <div class="jar-toolbar">
   <div>
    <div class="label">MONTHLY JAR</div>
    <div class="jar-week" id="jarWeekTitle"></div>
   </div>
   <div class="jar-nav">
    <button onclick="changeJarMonth(-1)">‹</button>
    <button class="current" onclick="goCurrentJarMonth()">本周</button>
    <button onclick="changeJarMonth(1)">›</button>
   </div>
  </div>
  <div class="jar-count" id="jarCount"></div>
  <div class="jar-wrap" id="jarWrap">
   <div class="jar-neck"></div>
   <div class="jar-highlight"></div>
   <div class="jar-glass"></div>
  </div>
 </section>
</main>

</div>

<nav class="bottom">

 <button
  class="nav active"
  id="navChance"
  onclick="showPage('chance')"
 >
  偶然
 </button>

 <button
  class="nav"
  id="navCalendar"
  onclick="showPage('calendar')"
 >
  日历
 </button>

 <button
  class="nav"
  id="navJar"
  onclick="showPage('jar')"
 >
  贴纸罐
 </button>

</nav>


<!-- 编辑窗口 -->

<div id="editor" class="overlay">

 <div class="sheet">

  <div class="sheethead">
   <strong id="editorTitle">留下一件事</strong>
   <button class="close" onclick="closeEditor()">×</button>
  </div>

  <div class="field">
   <input id="editDate" type="date">
  </div>

  <div class="field">
   <textarea
    id="editText"
    placeholder="写点什么……"
   ></textarea>
  </div>

  <img
   id="preview"
   class="preview"
   style="display:none"
  >

  <div id="photoMode" class="photo-mode">
   <div class="photo-mode-title">照片怎么留下？</div>
   <div class="photo-mode-grid">
    <button id="modeOriginal" class="photo-mode-btn active" onclick="setPhotoMode('original')">▣ 保留原图</button>
    <button id="modeSticker" class="photo-mode-btn sticker" onclick="setPhotoMode('sticker')">✦ 裁成贴纸</button>
   </div>
   <div id="photoModeHint" class="photo-mode-hint">贴纸会识别主体、扣掉背景，并自动加干净的白边。</div>
  </div>

  <div class="actions">

   <button
    class="iconbtn"
    onclick="document.getElementById('photoInput').click()"
    aria-label="添加照片"
    title="添加照片"
   >
    <svg viewBox="0 0 18 18">
     <rect x="3" y="3" width="12" height="12" rx="2"/>
     <circle cx="6.5" cy="6.5" r="1.2"/>
     <path d="m4.5 13 3.2-3.2 2.3-1.5 2 2.5"/>
    </svg>
   </button>

   <button
    class="iconbtn dark"
    onclick="saveEditor()"
    aria-label="保存"
    title="保存"
   >
    <svg viewBox="0 0 18 18">
     <path d="M4 3.5h8l2 2V15H4z"/>
     <path d="M6.5 3.5v4h5v-4M6.5 15v-4h5v4"/>
    </svg>
   </button>

  </div>

  <input
   id="photoInput"
   type="file"
   accept="image/*"
   capture="environment"
   style="display:none"
   onchange="loadPhoto(event)"
  >

 </div>

</div>


<!-- 查看窗口 -->

<div id="viewer" class="overlay">

 <div class="sheet">

  <div class="sheethead">
   <strong id="viewDate"></strong>
   <button class="close" onclick="closeViewer()">×</button>
  </div>

  <div id="viewContent"></div>

  <div class="iconrow">

   <button
    class="iconbtn"
    onclick="editCurrent()"
    aria-label="编辑"
    title="编辑"
   >
    <svg viewBox="0 0 18 18">
     <path d="M3.5 13.8V16h2.2L14.8 6.9l-2.2-2.2-9.1 9.1ZM11.5 6.2l2.2 2.2"/>
    </svg>
   </button>

   <button
    class="iconbtn"
    onclick="deleteCurrent()"
    aria-label="删除"
    title="删除"
   >
    <svg viewBox="0 0 18 18">
     <path d="M4 5h10M7 5V3.5h4V5M5 5l.7 10h6.6L13 5M7.5 8v4.5M10.5 8v4.5"/>
    </svg>
   </button>

  </div>

 </div>

</div>


<!-- 设置窗口 -->

<div id="settings" class="overlay">

 <div class="sheet">

  <div class="sheethead">
   <strong>设置</strong>
   <button class="close" onclick="closeSettings()">×</button>
  </div>

  <div
   class="setting-row"
   onclick="exportData()"
  >
   <div>
    <div class="setting-name">导出日志</div>
    <div class="setting-desc">保存 future 日志备份</div>
   </div>

   <svg viewBox="0 0 18 18">
    <path d="M9 12V3M6 6l3-3 3 3M4 10v4h10v-4"/>
   </svg>
  </div>

  <div
   class="setting-row"
   onclick="document.getElementById('importInput').click()"
  >
   <div>
    <div class="setting-name">导入日志</div>
    <div class="setting-desc">从 JSON 文件恢复日志</div>
   </div>

   <svg viewBox="0 0 18 18">
    <path d="M9 6v9M6 12l3 3 3-3M4 4h10v4"/>
   </svg>
  </div>

  <!-- 这里明确是文件，不是图片 -->
  <input
   id="importInput"
   type="file"
   accept=".json,application/json"
   style="display:none"
   onchange="importData(event)"
  >

  <div
   class="setting-row"

<!-- 图片放大 -->

<div
 id="imageLightbox"
 class="image-lightbox"
 onclick="closeLightbox(event)"
>
 <img id="lightboxImage" src="" alt="">
</div>


<script>

const KEY='futurism-records-v2';

let records=JSON.parse(localStorage.getItem(KEY)||'[]');

let currentMonth=new Date();
currentMonth.setDate(1);

let editingId=null;
let viewingId=null;
let tempPhoto='';
let tempOriginalPhoto='';
let tempPhotoMode='original';
let stickerProcessing=false;
let jarMonthStart=null;

let lastToday='';


function persist(){
 localStorage.setItem(KEY,JSON.stringify(records));
 if(document.getElementById('jar')?.classList.contains('active')) renderJar();
}


function todayISO(){

 const d=new Date();

 return d.getFullYear()
  +'-'
  +String(d.getMonth()+1).padStart(2,'0')
  +'-'
  +String(d.getDate()).padStart(2,'0');

}


function todayISODate(d){

 return d.getFullYear()
  +'-'
  +String(d.getMonth()+1).padStart(2,'0')
  +'-'
  +String(d.getDate()).padStart(2,'0');

}


function fmt(d){

 return d.replaceAll('-','.');

}


function setTimeTheme(){

 const h=new Date().getHours();

 document.body.classList.remove(
  'time-morning',
  'time-day',
  'time-evening',
  'time-night',
  'time-late'
 );

 document.body.classList.add(
  h>=6&&h<10
   ?'time-morning'
   :h>=10&&h<16
   ?'time-day'
   :h>=16&&h<20
   ?'time-evening'
   :h>=20&&h<24
   ?'time-night'
   :'time-late'
 );

}


function esc(s){

 return String(s).replace(
  /[&<>"']/g,
  c=>({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#39;'
  }[c])
 );

}


/* 文字 + 图片统一左右布局 */

function mediaHtml(r){

 const text=r.text
  ?'<div class="memory-text">'+esc(r.text)+'</div>'
  :'';

 const photo=r.photo
  ?'<img class="photo" src="'+r.photo+'" onclick="openLightbox(this.src,event)" alt="">'
  :'';

 if(r.photo&&r.text){

  return '<div class="media-layout">'
   +text
   +photo
   +'</div>';

 }

 if(r.photo){

  return '<img class="photo photo-only" src="'+r.photo+'" onclick="openLightbox(this.src,event)" alt="">';

 }

 return text;

}


/* 图片放大 */

function openLightbox(src,e){

 if(e)e.stopPropagation();

 document.getElementById('lightboxImage').src=src;

 document
  .getElementById('imageLightbox')
  .classList.add('show');

}


function closeLightbox(e){

 const box=document.getElementById('imageLightbox');

 if(e&&e.target!==box)return;

 box.classList.remove('show');

 document.getElementById('lightboxImage').src='';

}


/* 页面切换 */

function showPage(id){

 document
  .querySelectorAll('.page')
  .forEach(x=>x.classList.remove('active'));

 document
  .getElementById(id)
  .classList.add('active');

 document
  .querySelectorAll('.nav')
  .forEach(x=>x.classList.remove('active'));

 document
  .getElementById(
   id==='chance'
    ?'navChance'
    :id==='calendar'
      ?'navCalendar'
      :'navJar'
  )
  .classList.add('active');

 if(id==='calendar'){
  renderCalendar();
 }else if(id==='jar'){
  renderJar();
 }else{
  renderChance();
 }

}


/* 偶然 */

function renderChance(){

 const box=document.getElementById('memory');

 const past=records.filter(
  r=>r.date<todayISO()
 );

 if(!past.length){

  box.innerHTML=
   '<div class="card empty">'
   +'还没有来自过去的消息。<br>'
   +'先留下一点，未来再偶然遇见。'
   +'</div>';

 }else{

  const fromKey='futurism-from-'+todayISO();
 let savedId=localStorage.getItem(fromKey);
 let r=past.find(x=>String(x.id)===String(savedId));
 if(!r){
  r=past[Math.floor(Math.random()*past.length)];
  localStorage.setItem(fromKey,String(r.id));
 }

  box.innerHTML=
   '<div class="card">'
   +'<div class="label">FROM</div>'
   +'<div class="date">'+fmt(r.date)+'</div>'
   +mediaHtml(r)
   +'<div class="small-actions">'
   +'<button onclick="openViewer(\''+r.id+'\')">查看</button>'
   +'</div>'
   +'</div>';

 }


 /* 最近五个自然日 */

 const recent=document.getElementById('recent');

 const today=
  new Date(todayISO()+'T00:00:00');

 const cutoff=new Date(today);

 cutoff.setDate(
 cutoff.getDate()-4
 );

 const minDate=todayISODate(cutoff);

 const rs=[...records]
  .filter(
   r=>r.date>=minDate&&r.date<=todayISO()
  )
  .sort(
   (a,b)=>b.date.localeCompare(a.date)
  );

 recent.innerHTML=rs.length
  ?'<div class="label" style="margin:25px 4px 10px">RECENT</div>'
   +rs.map(
    r=>
     '<div class="card">'
     +'<div class="date">'+fmt(r.date)+'</div>'
     +mediaHtml(r)
     +'<div class="small-actions">'
     +'<button onclick="openViewer(\''+r.id+'\')">查看</button>'
     +'</div>'
     +'</div>'
   ).join('')
  :'';

}


/* 日历 */

function renderCalendar(){

 const y=currentMonth.getFullYear();
 const m=currentMonth.getMonth();

 document.getElementById('monthTitle').textContent=
  y+' · '+String(m+1).padStart(2,'0');

 const first=new Date(y,m,1);

 const start=(first.getDay()+6)%7;

 const days=
  new Date(y,m+1,0).getDate();

 let html='';


 for(let i=0;i<start;i++){

  let d=
   new Date(
    y,
    m,
    i-start+1
   );

  html+=
   '<div class="day other">'
   +'<div class="daynum">'+d.getDate()+'</div>'
   +'</div>';

 }


 for(let n=1;n<=days;n++){

  const iso=
   y+'-'
   +String(m+1).padStart(2,'0')
   +'-'
   +String(n).padStart(2,'0');

  const rs=
   records.filter(
    r=>r.date===iso
   );

  const r=
   rs.find(x=>x.photo);

  html+=
   '<button class="day '+(r?'hasphoto':'')+'"'
   +' onclick="openDay(\''+iso+'\')">'
   +(r
    ?'<img class="thumb" src="'+r.photo+'">'
    :'')
   +'<div class="daynum">'+n+'</div>'
   +(rs.length
    ?'<i class="mark"></i>'
    :'')
   +'</button>';

 }

 document.getElementById('cal').innerHTML=html;

}


function changeMonth(n){

 currentMonth.setMonth(
  currentMonth.getMonth()+n
 );

 renderCalendar();

}


/* 打开日期 */

function openDay(date){

 const rs=
  records.filter(
   r=>r.date===date
  );

 if(rs.length===1){

  openViewer(rs[0].id);

 }else if(rs.length>1){

  document.getElementById('viewDate')
   .textContent=fmt(date);

  document.getElementById('viewContent')
   .innerHTML=rs.map(r=>
    '<div class="multi-record" style="padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid #eee">'
    +mediaHtml(r)
    +'<div class="small-actions" style="margin-top:10px;display:flex;gap:8px">'
    +'<button onclick="openViewer(\''+r.id+'\')">查看</button>'
    +'<button onclick="editRecordFromDay(\''+r.id+'\')">编辑</button>'
    +'<button onclick="deleteRecordFromDay(\''+r.id+'\')">删除</button>'
    +'</div></div>'
   ).join('');

  viewingId=null;

  document
   .getElementById('viewer')
   .classList.add('show');

 }else{

  openEditor(date);

 }

}


/* 编辑 */

function openEditor(
 date=todayISO(),
 id=null
){

 editingId=id;
 tempPhoto='';
 tempOriginalPhoto='';
 tempPhotoMode='original';
 stickerProcessing=false;

 document.getElementById('editorTitle')
  .textContent=
   id
    ?'编辑记录'
    :'留下一件事';

 document.getElementById('editDate')
  .value=date;

 const r=
  id
   ?records.find(x=>x.id===id)
   :null;

 document.getElementById('editText')
  .value=r?.text||'';

 if(r?.photo){

  tempPhoto=r.photo;
  tempPhotoMode=r.photoMode||'original';
  tempOriginalPhoto=r.originalPhoto||'';
  showPreview(r.photo);
  showPhotoMode(true);
  updatePhotoModeUI();

 }else{

  document.getElementById('preview').style.display='none';
  showPhotoMode(false);

 }

 document
  .getElementById('editor')
  .classList.add('show');

}


function closeEditor(){

 document
  .getElementById('editor')
  .classList.remove('show');

}


/* 读取照片并压缩 */

function loadPhoto(e){

 const f=e.target.files[0];
 if(!f)return;
 const rd=new FileReader();
 rd.onload=()=>{
  const img=new Image();
  img.onload=()=>{
   const max=1280;
   const scale=Math.min(1,max/Math.max(img.width,img.height));
   const c=document.createElement('canvas');
   c.width=Math.max(1,Math.round(img.width*scale));
   c.height=Math.max(1,Math.round(img.height*scale));
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);
   tempOriginalPhoto=c.toDataURL('image/jpeg',.82);
   tempPhoto=tempOriginalPhoto;
   tempPhotoMode='original';
   showPreview(tempPhoto);
   showPhotoMode(true);
   updatePhotoModeUI();
  };
  img.src=rd.result;
 };
 rd.readAsDataURL(f);
 e.target.value='';
}


function showPhotoMode(show){
 const box=document.getElementById('photoMode');
 if(!box)return;
 box.classList.toggle('show',!!show);
}

function updatePhotoModeUI(){
 const o=document.getElementById('modeOriginal');
 const st=document.getElementById('modeSticker');
 if(!o||!st)return;
 o.classList.toggle('active',tempPhotoMode==='original');
 st.classList.toggle('active',tempPhotoMode==='sticker');
 const p=document.getElementById('preview');
 if(p)p.classList.toggle('sticker-preview',tempPhotoMode==='sticker');
 const hint=document.getElementById('photoModeHint');
 if(hint){
  hint.innerHTML=tempPhotoMode==='sticker'
   ?'正在使用主体识别：只保留主体，透明背景，并自动加白色贴纸边。'
   :'保留照片原貌，不进行抠图。';
 }
}

function setPhotoMode(mode){
 if(!tempOriginalPhoto&& !tempPhoto)return;
 tempPhotoMode=mode;
 updatePhotoModeUI();
 if(mode==='original'){
  if(tempOriginalPhoto){tempPhoto=tempOriginalPhoto;showPreview(tempPhoto);}
  return;
 }
 if(stickerProcessing)return;
 stickerProcessing=true;
 const hint=document.getElementById('photoModeHint');
 if(hint)hint.innerHTML='<span class="processing">正在识别主体并制作贴纸…</span>';
 if(window.Android&&typeof window.Android.makeSticker==='function'){
  window.Android.makeSticker(tempOriginalPhoto||tempPhoto);
 }else{
  stickerProcessing=false;
  tempPhotoMode='original';
  updatePhotoModeUI();
  alert('请使用 future APK 版本进行主体抠图。');
 }
}

window.onStickerReady=function(dataUrl){
 stickerProcessing=false;
 if(!dataUrl){
  tempPhotoMode='original';
  updatePhotoModeUI();
  alert('主体识别没有得到有效结果。请保持网络连接后再试一次；如果仍失败，再换一张主体明显的照片。');
  return;
 }
 tempPhoto=dataUrl;
 tempPhotoMode='sticker';
 showPreview(tempPhoto);
 updatePhotoModeUI();
};

function showPreview(src){

 const p=
  document.getElementById('preview');

 p.src=src;

 p.style.display='block';

}


/* 保存编辑 */

function saveEditor(){

 const text=
  document
   .getElementById('editText')
   .value
   .trim();

 const date=
  document
   .getElementById('editDate')
   .value;

 if(
  !date||
  (!text&&!tempPhoto)
 ){

  alert('至少留下文字或照片');

  return;

 }


 if(editingId){

  const r=
   records.find(
    x=>x.id===editingId
   );

  if(r){

   r.date=date;
   r.text=text;
   r.photo=tempPhoto;
   r.photoMode=tempPhotoMode;
   r.originalPhoto=tempOriginalPhoto||r.originalPhoto||'';

  }

 }else{

  records.push({

   id:crypto.randomUUID(),

   date,

   text,

   photo:tempPhoto,
   photoMode:tempPhotoMode,
   originalPhoto:tempOriginalPhoto

  });

 }


 persist();

 currentMonth=
  new Date(date+'T00:00:00');

 currentMonth.setDate(1);

 closeEditor();

 renderChance();

 renderCalendar();

}


/* 首页直接留下文字 */

function saveToday(){

 const text=
  document
   .getElementById('todayText')
   .value
   .trim();

 if(!text){

  openEditor();

  return;

 }

 records.push({

  id:crypto.randomUUID(),

  date:todayISO(),

  text,

  photo:''

 });

 persist();

 document.getElementById('todayText')
  .value='';

 currentMonth=new Date();
 currentMonth.setDate(1);

 renderChance();

 renderCalendar();

}

function openViewer(id){

  );

 if(!r)return;

/* 编辑当前记录 */

function editRecordFromDay(id){
 const r=records.find(x=>x.id===id);
 if(!r)return;
 closeViewer();
 openEditor(r.date,id);
}

function deleteRecordFromDay(id){
 const r=records.find(x=>x.id===id);
 if(!r)return;
 if(!confirm('删除这条记录吗？'))return;
 records=records.filter(x=>x.id!==id);
 persist();
 closeViewer();
 renderChance();
 renderCalendar();
}

function editCurrent(){

 if(!viewingId)return;

 const r=
  records.find(
   x=>x.id===viewingId
  );

 if(!r)return;

 closeViewer();

 openEditor(
  r.date,
  viewingId
 );

}


/* 删除：不再询问 */

function deleteCurrent(){

 if(!viewingId)return;

 records=
  records.filter(
   r=>r.id!==viewingId
  );

 persist();

 closeViewer();

 renderChance();

 renderCalendar();

}


/* 每月贴纸罐 + 小年历 */
function monthStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(1);return x;}
function jarMonthKey(d){return todayISODate(monthStart(d)).slice(0,7);}
function jarMonthLabel(d){return new Date(d).getFullYear()+'年 '+(new Date(d).getMonth()+1)+'月';}
function ensureJarMonth(){if(!jarMonthStart)jarMonthStart=monthStart(new Date());}
function renderJarMiniCalendar(){
 ensureJarMonth();
 const title=document.getElementById('jarMiniTitle'),grid=document.getElementById('jarMiniCal');
 if(!title||!grid)return;
 title.textContent=jarMonthLabel(jarMonthStart);
 grid.innerHTML='';
 const y=jarMonthStart.getFullYear(),m=jarMonthStart.getMonth();
 const first=(new Date(y,m,1).getDay()+6)%7;
 const days=new Date(y,m+1,0).getDate();
 const prevDays=new Date(y,m,0).getDate();
 for(let i=0;i<42;i++){
  const btn=document.createElement('button');btn.className='jar-mini-day';
  const n=i-first+1; let yy=y,mm=m,dd=n;
  if(n<1){dd=prevDays+n;mm=m-1;if(mm<0){mm=11;yy--;}}
  else if(n>days){dd=n-days;mm=m+1;if(mm>11){mm=0;yy++;}}
  const iso=yy+'-'+String(mm+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
  btn.textContent=dd;
  if(mm!==m)btn.classList.add('muted');
  if(iso===todayISO())btn.classList.add('today');
  if(mm===m)btn.classList.add('selected');
  btn.onclick=()=>{jarMonthStart=monthStart(new Date(yy,mm,dd));renderJar();};
  grid.appendChild(btn);
 }
}
function renderJar(){
 ensureJarMonth();
 const title=document.getElementById('jarWeekTitle'),count=document.getElementById('jarCount'),wrap=document.getElementById('jarWrap');
 if(!title||!count||!wrap)return;
 title.textContent=jarMonthLabel(jarMonthStart);
 renderJarMiniCalendar();
 const key=jarMonthKey(jarMonthStart);
 const stickers=records.filter(r=>r.photo&&r.photoMode==='sticker'&&typeof r.date==='string'&&r.date.slice(0,7)===key);
 count.textContent=stickers.length+' 张贴纸';
 wrap.querySelectorAll('.jar-sticker,.jar-empty').forEach(x=>x.remove());
 if(!stickers.length){const e=document.createElement('div');e.className='jar-empty';e.innerHTML='这个月还没有贴纸<br>每天留下一张，它们会慢慢落进玻璃罐。';wrap.appendChild(e);return;}
 const w=wrap.clientWidth||340,h=wrap.clientHeight||520,pad=20;
 const density=Math.min(1,Math.sqrt(18/Math.max(1,stickers.length)));
 const maxW=Math.min(w*.40,145)*density; const maxH=Math.min(h*.21,110)*density; const placed=[];
 stickers.forEach((r,index)=>{
  const img=document.createElement('img');img.className='jar-sticker';img.src=r.photo;img.alt='';
  const bw=maxW*(.72+Math.random()*.24),bh=maxH*(.72+Math.random()*.24); let best=null;
  for(let tries=0;tries<140;tries++){const cx=pad+Math.random()*Math.max(1,w-bw-pad*2),cy=70+Math.random()*Math.max(1,h-bh-pad-70),gap=8;const hit=placed.some(q=>cx<q.x+q.w+gap&&cx+bw+gap>q.x&&cy<q.y+q.h+gap&&cy+bh+gap>q.y);if(!hit){best={x:cx,y:cy,w:bw,h:bh};break;}best=best||{x:cx,y:cy,w:bw,h:bh};}
  placed.push(best); img.style.width=bw+'px';img.style.height=bh+'px';img.style.left=best.x+'px';img.style.top=best.y+'px';
  img.style.setProperty('--r',(Math.random()*14-7).toFixed(2)+'deg');img.style.animationDelay=(index*35)+'ms';wrap.appendChild(img);
 });
}
function changeJarMonth(delta){ensureJarMonth();jarMonthStart=new Date(jarMonthStart);jarMonthStart.setMonth(jarMonthStart.getMonth()+delta);jarMonthStart=monthStart(jarMonthStart);renderJar();}
function goCurrentJarMonth(){jarMonthStart=monthStart(new Date());renderJar();}

/* 导出 */

function exportData(){

 const payload={
  app:'future',
  version:2,
  exportedAt:new Date().toISOString(),
  records
 };

 const json=
  JSON.stringify(
   payload,
   null,
   2
  );

 const filename=
  'future-日志备份-'
  +todayISO()
  +'.json';


 /* APK 原生文件保存 */

 if(
  window.Android&&
  typeof window.Android.saveFile==='function'
 ){

  window.Android.saveFile(
   filename,
   json
  );

  return;

 }


 /* 浏览器备用方案 */

 const blob=
  new Blob(
   [json],
   {type:'application/json'}
  );

 const a=
  document.createElement('a');

 a.href=
  URL.createObjectURL(blob);

 a.download=filename;

 a.click();

 setTimeout(
  ()=>URL.revokeObjectURL(a.href),
  1000
 );

}


/* 导入 JSON 文件 */

function importData(e){

 const f=e.target.files[0];

 if(!f)return;

 const rd=new FileReader();

 rd.onload=()=>{

  try{

   const data=
    JSON.parse(rd.result);

   const incoming=
    Array.isArray(data)
     ?data
     :data.records;

   if(!Array.isArray(incoming))
    throw new Error();


   const clean=
    incoming
     .filter(
      r=>r&&r.id&&r.date
     )
     .map(
      r=>({
       id:String(r.id),
       date:String(r.date),
       text:String(r.text||''),
       photo:String(r.photo||''),
       photoMode:r.photoMode==='sticker'?'sticker':'original',
       originalPhoto:String(r.originalPhoto||'')
      })
     );


   if(
    !confirm(
     '导入将与现有记录合并，重复记录会覆盖。继续吗？'
    )
   ){

    e.target.value='';

    return;

   }


   const map=
    new Map(
     records.map(
      r=>[r.id,r]
     )
    );


   clean.forEach(
    r=>map.set(r.id,r)
   );


   records=
    [...map.values()];


   persist();

   renderChance();

   renderCalendar();

   closeSettings();

   alert('导入完成');


  }catch(err){

   alert('备份文件无法读取');

  }


  e.target.value='';

 };


 rd.readAsText(f);

}


/* 添加到桌面 */

let deferredInstallPrompt=null;

window.addEventListener(
 'beforeinstallprompt',
 e=>{

  e.preventDefault();

  deferredInstallPrompt=e;

 }
);


async function installApp(){

 if(deferredInstallPrompt){

  deferredInstallPrompt.prompt();

  await deferredInstallPrompt.userChoice;

  deferredInstallPrompt=null;

 }else{

  alert(
   '在 Android Chrome 中，请打开浏览器菜单 ⋮，选择“安装应用”或“添加到主屏幕”。如果已经安装，则无需重复操作。'
  );

 }

}


/* 初始化 */

renderChance();

renderCalendar();

jarMonthStart=monthStart(new Date());
renderJar();

setTimeTheme();

lastToday=todayISO();


/* 自动跨午夜更新 */

setInterval(()=>{

 setTimeTheme();

 const now=todayISO();

 if(now!==lastToday){

  const oldDate=
   new Date(
    lastToday+'T00:00:00'
   );

  const wasCurrentMonth=
   currentMonth.getFullYear()
    ===oldDate.getFullYear()
   &&
   currentMonth.getMonth()
    ===oldDate.getMonth();


  lastToday=now;


  if(wasCurrentMonth){

   currentMonth=new Date();

   currentMonth.setDate(1);

  }


  renderChance();

  renderCalendar();
jarMonthStart=monthStart(new Date());
renderJar();

 }

},30000);


/* PWA */

if(
 "serviceWorker" in navigator
){

 navigator.serviceWorker
  .register("./sw.js")
  .catch(()=>{});

}
