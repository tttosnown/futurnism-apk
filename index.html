<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f0f8">
<title>future</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="future">
<link rel="icon" href="icons/icon-192.png">

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f3f0f8;
 color:#17151a;
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;
 transition:background 1.2s ease;
}
button,input,textarea{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
button:focus{outline:none}
button,input,textarea{ -webkit-tap-highlight-color:transparent }

.app{
 max-width:760px;
 margin:auto;
 min-height:100vh;
 padding-bottom:88px;
}

header{
 padding:28px 22px 18px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 font-size:27px;
 font-weight:650;
 letter-spacing:-.04em;
}

.sub{
 font-size:12px;
 opacity:.45;
}

.page{
 display:none;
 padding:0 18px;
 opacity:0;
 transform:translateY(3px);
 pointer-events:none;
 transition:opacity .16s ease,transform .16s ease;
}

.page.active{
 display:block;
 opacity:1;
 transform:translateY(0);
 pointer-events:auto;
}

.card{
 background:#fff;
 border-radius:24px;
 padding:22px;
 margin-bottom:14px;
 box-shadow:0 3px 18px #00000008;
}

.label{
 font-size:11px;
 letter-spacing:.1em;
 text-transform:uppercase;
 opacity:.42;
 margin-bottom:12px;
}

.date{
 font-size:13px;
 opacity:.5;
 margin-bottom:14px;
}

.memory-title{
 font-size:23px;
 line-height:1.25;
 margin-bottom:16px;
}

.memory-text{
 font-size:16px;
 line-height:1.7;
 white-space:pre-wrap;
 word-break:break-word;
}

.empty{
 padding:48px 20px;
 text-align:center;
 opacity:.45;
}

.today{
 margin-top:28px;
}

.today textarea{
 width:100%;
 min-height:110px;
 border:0;
 outline:0;
 resize:vertical;
 background:#f7f5f9;
 border-radius:18px;
 padding:16px;
}

.actions{
 display:flex;
 gap:10px;
 margin-top:12px;
}

.pill{
 padding:11px 15px;
 border-radius:999px;
 background:#17151a;
 color:white;
 font-size:13px;
}

.pill.light{
 background:#eeeaf1;
 color:#17151a;
}

.bottom{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:min(760px,100%);
 padding:10px 18px calc(10px + env(safe-area-inset-bottom));
 background:linear-gradient(to top,rgba(255,255,255,.78),rgba(255,255,255,.2));
 backdrop-filter:blur(18px);
 display:flex;
 gap:8px;
 z-index:4;
 transition:background 1.2s ease;
}

.nav{
 flex:1;
 padding:13px;
 border-radius:16px;
 font-size:14px;
}

.nav.active{
 background:#17151a;
 color:white;
}

.monthbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:8px 3px 18px;
}

.month{
 font-size:22px;
 font-weight:600;
}

.arrow{
 width:40px;
 height:40px;
 border-radius:50%;
 background:#fff;
 font-size:22px;
}

.week,
.calendar{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:6px;
}

.week div{
 text-align:center;
 font-size:10px;
 opacity:.35;
 padding-bottom:5px;
}

.day{
 min-height:72px;
 background:#fff;
 border-radius:13px;
 padding:8px;
 position:relative;
 overflow:hidden;
}

.day.other{
 opacity:.28;
}

.daynum{
 font-size:11px;
 opacity:.5;
 position:relative;
 z-index:2;
}

.mark{
 position:absolute;
 right:7px;
 bottom:7px;
 width:7px;
 height:7px;
 border-radius:50%;
 background:#17151a;
}

.thumb{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
 opacity:.72;
}

.day.hasphoto .daynum{
 background:#fff;
 border-radius:8px;
 padding:2px 4px;
 width:max-content;
}

.overlay{
 display:none;
 position:fixed;
 inset:0;
 background:#00000045;
 z-index:5;
 align-items:flex-end;
 opacity:0;
 transition:opacity .16s ease;
}

.overlay.show{
 display:flex;
 opacity:1;
}

.sheet{
 width:100%;
 max-width:760px;
 margin:auto;
 background:#fff;
 border-radius:28px 28px 0 0;
 padding:20px 18px calc(24px + env(safe-area-inset-bottom));
 max-height:88vh;
 overflow:auto;
 transform:translateY(12px);
 opacity:.96;
 transition:transform .18s ease,opacity .18s ease;
}

.overlay.show .sheet{
 transform:translateY(0);
 opacity:1;
}

.sheethead{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:18px;
}

.close{
 font-size:25px;
 width:38px;
 height:38px;
 border-radius:50%;
 background:#f1eef3;
}

.field{
 margin-bottom:12px;
}

.field input,
.field textarea{
 width:100%;
 border:0;
 background:#f6f4f7;
 border-radius:16px;
 padding:13px;
 outline:0;
}

.field textarea{
 min-height:130px;
 resize:vertical;
}

.preview{
 max-height:300px;
 width:100%;
 object-fit:cover;
 border-radius:18px;
 margin:8px 0;
}

.record-list .card{
 padding:17px;
}

.small-actions{
 display:flex;
 gap:8px;
 margin-top:12px;
}

.small-actions button{
 font-size:12px;
 padding:8px 12px;
 border-radius:999px;
 background:#eeeaf1;
}

.iconbtn{
 width:38px;
 height:38px;
 border-radius:50%;
 display:inline-flex;
 align-items:center;
 justify-content:center;
 background:#eeecef;
 color:#111;
 padding:0;
}

.iconbtn.dark{
 background:#111;
 color:#fff;
}

.iconbtn svg{
 width:18px;
 height:18px;
 stroke:currentColor;
 fill:none;
 stroke-width:1.8;
 stroke-linecap:round;
 stroke-linejoin:round;
}

.iconrow{
 display:flex;
 gap:8px;
 margin-top:12px;
}

.more{
 width:40px;
 height:40px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:3px;
 background:rgba(255,255,255,.62);
}

.more span{
 width:3px;
 height:3px;
 background:#111;
 border-radius:50%;
}

.setting-row{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:17px 4px;
 border-bottom:1px solid #eee;
 cursor:pointer;
}

.setting-row:last-of-type{
 border-bottom:0;
}

.setting-name{
 font-size:15px;
}

.setting-desc{
 font-size:11px;
 opacity:.42;
 margin-top:4px;
}

.setting-row>svg{
 width:21px;
 height:21px;
 stroke:#111;
 fill:none;
 stroke-width:1.7;
 stroke-linecap:round;
 stroke-linejoin:round;
}


/* 纸张与 future 视觉层次 */
body{
 background-image:radial-gradient(rgba(30,25,35,.035) .7px,transparent .7px);
 background-size:7px 7px;
}
.card,.sheet,.day,.arrow,.jar-week-btn{
 border:1px solid rgba(30,25,35,.045);
 box-shadow:0 8px 24px rgba(20,15,25,.055), inset 0 1px 0 rgba(255,255,255,.72);
}
.card{
 background:rgba(255,255,255,.88);
}
.pill,.nav.active{box-shadow:0 5px 14px rgba(20,15,25,.10)}

.photo-mode{margin:2px 0 14px;padding:14px;border-radius:18px;background:rgba(246,243,247,.86);}
.photo-mode-title{font-size:12px;opacity:.55;margin-bottom:10px}
.photo-mode-options{display:flex;gap:8px}
.mode-option{flex:1;padding:12px 10px;border-radius:14px;background:#fff;border:1px solid #e7e2e9;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px}
.mode-option.active{background:#17151a;color:#fff;border-color:#17151a}
.mode-icon{font-size:15px}
.mode-note{font-size:10px;line-height:1.5;opacity:.42;margin-top:9px}

.jar-head{display:flex;justify-content:space-between;align-items:end;margin:8px 4px 10px}
.jar-title{font-size:22px;font-weight:600}
.jar-count{font-size:12px;opacity:.5}
.jar-nav{display:flex;align-items:center;justify-content:space-between;margin:0 3px 14px}
.jar-week-btn{padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.76);font-size:12px}
.glass-jar{position:relative;width:min(100%,520px);height:58vh;min-height:430px;max-height:680px;margin:0 auto 14px;border-radius:42px 42px 54px 54px;background:linear-gradient(90deg,rgba(255,255,255,.34),rgba(255,255,255,.08) 15%,rgba(255,255,255,.05) 75%,rgba(255,255,255,.28));border:2px solid rgba(255,255,255,.62);box-shadow:inset 0 0 0 1px rgba(90,80,100,.08),inset 12px 0 25px rgba(255,255,255,.25),inset -12px 0 25px rgba(120,110,130,.08),0 18px 35px rgba(50,40,60,.10);overflow:hidden}
.jar-rim{position:absolute;left:6%;right:6%;top:8px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.58);background:rgba(255,255,255,.16);box-shadow:0 4px 10px rgba(40,30,50,.08);z-index:3}
.jar-glass-shine{position:absolute;top:5%;bottom:8%;left:7%;width:12%;border-radius:50%;background:linear-gradient(to bottom,rgba(255,255,255,.50),rgba(255,255,255,.04));filter:blur(2px);z-index:4;pointer-events:none}
.jar-body{position:absolute;inset:8% 5% 6%;overflow:hidden}
.jar-bottom{position:absolute;left:7%;right:7%;bottom:5px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.36);background:rgba(255,255,255,.09)}
.jar-sticker{position:absolute;max-width:92px;max-height:92px;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 4px 5px rgba(30,25,35,.14));user-select:none}
.jar-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;font-size:13px;line-height:1.7;opacity:.34}
.jar-hint{font-size:11px;line-height:1.6;text-align:center;opacity:.38;padding:0 24px 20px}
@media(max-width:430px){.glass-jar{min-height:390px;height:54vh}.jar-sticker{max-width:76px;max-height:76px}}

/* 时间背景 */
body.time-morning{
 background:linear-gradient(135deg,#edf7fc 0%,#f7fbfd 50%,#eaf5fb 100%);
}

body.time-day{
 background:linear-gradient(135deg,#fff8ed 0%,#fffaf4 50%,#fff0dc 100%);
}

body.time-evening{
 background:linear-gradient(135deg,#fff1f3 0%,#fff8f8 50%,#fbecef 100%);
}

body.time-night{
 background:linear-gradient(135deg,#f4eef9 0%,#f8f4fb 50%,#eee8f5 100%);
}

body.time-late{
 background:linear-gradient(135deg,#f0f1f2 0%,#f7f7f7 50%,#e9eaec 100%);
}

/* 文字 + 图片左右布局 */
.media-layout{
 display:grid;
 grid-template-columns:minmax(0,1fr) minmax(0,2fr);
 gap:16px;
 align-items:center;
 margin-top:2px;
}

.media-layout .memory-text{
 min-width:0;
 word-break:break-word;
}

.media-layout .photo{
 width:100%;
 height:220px;
 max-height:320px;
 object-fit:cover;
 margin:0;
 cursor:zoom-in;
 border-radius:18px;
 display:block;
}

.photo{
 width:100%;
 border-radius:18px;
 display:block;
 margin:0 0 15px;
 max-height:420px;
 object-fit:cover;
}

.photo-only{
 cursor:zoom-in;
}

/* 图片放大层 */
.image-lightbox{
 display:none;
 position:fixed;
 inset:0;
 z-index:20;
 background:rgba(0,0,0,.86);
 align-items:center;
 justify-content:center;
 padding:22px;
 opacity:0;
 transition:opacity .18s ease;
}

.image-lightbox.show{
 display:flex;
 opacity:1;
}

.image-lightbox img{
 max-width:100%;
 max-height:100%;
 object-fit:contain;
 border-radius:12px;
}

@media(max-width:430px){
 .media-layout{
  grid-template-columns:minmax(0,1fr) minmax(0,2fr);
  gap:12px;
 }

 .media-layout .photo{
  height:190px;
 }

 .media-layout .memory-text{
  font-size:14px;
  line-height:1.6;
 }
}

#startupSplash{position:fixed;inset:0;z-index:9999;background:#f3f0f8;display:flex;align-items:center;justify-content:center;transition:opacity .2s ease}#startupSplash.hide{opacity:0;pointer-events:none}.startupSplashTitle{font-size:24px;letter-spacing:.02em;font-weight:500;color:#17151a}
</style>
</head>

<body>

<div id="startupSplash" aria-label="future 启动封面"><div class="startupSplashTitle">future</div></div>

<div class="app">

<header>
 <div>
  <div class="logo">future</div>
  <div class="sub">a little message from yourself</div>
 </div>

 <button class="more" onclick="openSettings()" aria-label="设置" title="设置">
  <span></span><span></span><span></span>
 </button>
</header>

<main id="chance" class="page active">

 <section id="memory"></section>

 <section class="card today">
  <div class="label">TODAY</div>
  <div class="memory-title">今天，想留下一点什么？</div>

  <textarea
   id="todayText"
   placeholder="写下一句话，或者留一张照片。"
  ></textarea>

  <div class="actions">
   <button class="pill" onclick="saveToday()">留下</button>
   <button class="pill light" onclick="openEditor()">添加照片</button>
  </div>
 </section>

 <section id="recent" class="record-list"></section>

</main>

<main id="calendar" class="page">

 <div class="monthbar">
  <button class="arrow" onclick="changeMonth(-1)">‹</button>
  <div class="month" id="monthTitle"></div>
  <button class="arrow" onclick="changeMonth(1)">›</button>
 </div>

 <div class="week">
  <div>一</div>
  <div>二</div>
  <div>三</div>
  <div>四</div>
  <div>五</div>
  <div>六</div>
  <div>日</div>
 </div>

 <div id="cal" class="calendar"></div>

</main>

<main id="jar" class="page">
 <section class="jar-head">
  <div>
   <div class="label">WEEKLY STICKER JAR</div>
   <div class="jar-title" id="jarTitle"></div>
  </div>
  <div class="jar-count" id="jarCount">0 张</div>
 </section>
 <div class="jar-nav">
  <button class="arrow" onclick="changeJarWeek(-1)">‹</button>
  <button class="jar-week-btn" id="jarWeekLabel" onclick="jumpToCurrentWeek()">本周</button>
  <button class="arrow" onclick="changeJarWeek(1)">›</button>
 </div>
 <section class="glass-jar" id="glassJar">
  <div class="jar-glass-shine"></div>
  <div class="jar-rim"></div>
  <div class="jar-body" id="jarBody"></div>
  <div class="jar-bottom"></div>
 </section>
 <div class="jar-hint">每周重新开始。你留下的每一张贴纸，都会落进这一周的玻璃罐里。</div>
</main>

</div>

<nav class="bottom">

 <button
  class="nav active"
  id="navChance"
  onclick="showPage('chance')"
 >
  偶然
 </button>

 <button
  class="nav"
  id="navCalendar"
  onclick="showPage('calendar')"
 >
  日历
 </button>

 <button
  class="nav"
  id="navJar"
  onclick="showPage('jar')"
 >
  贴纸罐
 </button>

</nav>


<!-- 编辑窗口 -->

<div id="editor" class="overlay">

 <div class="sheet">

  <div class="sheethead">
   <strong id="editorTitle">留下一件事</strong>
   <button class="close" onclick="closeEditor()">×</button>
  </div>

  <div class="field">
   <input id="editDate" type="date">
  </div>

  <div class="field">
   <textarea
    id="editText"
    placeholder="写点什么……"
   ></textarea>
  </div>

  <img
   id="preview"
   class="preview"
   style="display:none"
  >

  <div id="photoMode" class="photo-mode" style="display:none">
   <div class="photo-mode-title">照片怎么留下？</div>
   <div class="photo-mode-options">
    <button type="button" id="modeOriginal" class="mode-option active" onclick="setPhotoMode('original')">
     <span class="mode-icon">▣</span><span>保留原图</span>
    </button>
    <button type="button" id="modeSticker" class="mode-option" onclick="setPhotoMode('sticker')">
     <span class="mode-icon">✦</span><span>裁成贴纸</span>
    </button>
   </div>
   <div class="mode-note">贴纸会自动裁剪主体、加白色描边，并收进对应周的玻璃罐。</div>
  </div>

  <div class="actions">

   <button
    class="iconbtn"
    onclick="document.getElementById('photoInput').click()"
    aria-label="添加照片"
    title="添加照片"
   >
    <svg viewBox="0 0 18 18">
     <rect x="3" y="3" width="12" height="12" rx="2"/>
     <circle cx="6.5" cy="6.5" r="1.2"/>
     <path d="m4.5 13 3.2-3.2 2.3-1.5 2 2.5"/>
    </svg>
   </button>

   <button
    class="iconbtn dark"
    onclick="saveEditor()"
    aria-label="保存"
    title="保存"
   >
    <svg viewBox="0 0 18 18">
     <path d="M4 3.5h8l2 2V15H4z"/>
     <path d="M6.5 3.5v4h5v-4M6.5 15v-4h5v4"/>
    </svg>
   </button>

  </div>

  <input
   id="photoInput"
   type="file"
   accept="image/*"
   capture="environment"
   style="display:none"
   onchange="loadPhoto(event)"
  >

 </div>

</div>


<!-- 查看窗口 -->

<div id="viewer" class="overlay">

 <div class="sheet">

  <div class="sheethead">
   <strong id="viewDate"></strong>
   <button class="close" onclick="closeViewer()">×</button>
  </div>

  <div id="viewContent"></div>

  <div class="iconrow">

   <button
    class="iconbtn"
    onclick="editCurrent()"
    aria-label="编辑"
    title="编辑"
   >
    <svg viewBox="0 0 18 18">
     <path d="M3.5 13.8V16h2.2L14.8 6.9l-2.2-2.2-9.1 9.1ZM11.5 6.2l2.2 2.2"/>
    </svg>
   </button>

   <button
    class="iconbtn"
    onclick="deleteCurrent()"
    aria-label="删除"
    title="删除"
   >
    <svg viewBox="0 0 18 18">
     <path d="M4 5h10M7 5V3.5h4V5M5 5l.7 10h6.6L13 5M7.5 8v4.5M10.5 8v4.5"/>
    </svg>
   </button>

  </div>

 </div>

</div>


<!-- 设置窗口 -->

<div id="settings" class="overlay">

 <div class="sheet">

  <div class="sheethead">
   <strong>设置</strong>
   <button class="close" onclick="closeSettings()">×</button>
  </div>

  <div
   class="setting-row"
   onclick="exportData()"
  >
   <div>
    <div class="setting-name">导出日志</div>
    <div class="setting-desc">保存 future 日志备份</div>
   </div>

   <svg viewBox="0 0 18 18">
    <path d="M9 12V3M6 6l3-3 3 3M4 10v4h10v-4"/>
   </svg>
  </div>

  <div
   class="setting-row"
   onclick="document.getElementById('importInput').click()"
  >
   <div>
    <div class="setting-name">导入日志</div>
    <div class="setting-desc">从 JSON 文件恢复日志</div>
   </div>

   <svg viewBox="0 0 18 18">
    <path d="M9 6v9M6 12l3 3 3-3M4 4h10v4"/>
   </svg>
  </div>

  <!-- 这里明确是文件，不是图片 -->
  <input
   id="importInput"
   type="file"
   accept=".json,application/json"
   style="display:none"
   onchange="importData(event)"
  >

  <div
   class="setting-row"
   onclick="installApp()"
  >
   <div>
    <div class="setting-name">添加到桌面</div>
    <div class="setting-desc">将 future 安装到设备</div>
   </div>

   <svg viewBox="0 0 18 18">
    <path d="M9 3v12M3 9h12"/>
   </svg>
  </div>

 </div>

</div>


<!-- 图片放大 -->

<div
 id="imageLightbox"
 class="image-lightbox"
 onclick="closeLightbox(event)"
>
 <img id="lightboxImage" src="" alt="">
</div>


<script>

const KEY='futurism-records-v2';

let records=JSON.parse(localStorage.getItem(KEY)||'[]');

let currentMonth=new Date();
currentMonth.setDate(1);

let editingId=null;
let viewingId=null;
let tempPhoto='';
let tempPhotoMode='original';
let jarWeekOffset=0;

let lastToday='';


function persist(){
 localStorage.setItem(KEY,JSON.stringify(records));
 if(document.getElementById('jar')?.classList.contains('active')) renderJar();
}


function todayISO(){

 const d=new Date();

 return d.getFullYear()
  +'-'
  +String(d.getMonth()+1).padStart(2,'0')
  +'-'
  +String(d.getDate()).padStart(2,'0');

}


function todayISODate(d){

 return d.getFullYear()
  +'-'
  +String(d.getMonth()+1).padStart(2,'0')
  +'-'
  +String(d.getDate()).padStart(2,'0');

}


function fmt(d){

 return d.replaceAll('-','.');

}


function setTimeTheme(){

 const h=new Date().getHours();

 document.body.classList.remove(
  'time-morning',
  'time-day',
  'time-evening',
  'time-night',
  'time-late'
 );

 document.body.classList.add(
  h>=6&&h<10
   ?'time-morning'
   :h>=10&&h<16
   ?'time-day'
   :h>=16&&h<20
   ?'time-evening'
   :h>=20&&h<24
   ?'time-night'
   :'time-late'
 );

}


function esc(s){

 return String(s).replace(
  /[&<>"']/g,
  c=>({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#39;'
  }[c])
 );

}


/* 文字 + 图片统一左右布局 */

function mediaHtml(r){

 const text=r.text
  ?'<div class="memory-text">'+esc(r.text)+'</div>'
  :'';

 const photo=r.photo
  ?'<img class="photo" src="'+r.photo+'" onclick="openLightbox(this.src,event)" alt="">'
  :'';

 if(r.photo&&r.text){

  return '<div class="media-layout">'
   +text
   +photo
   +'</div>';

 }

 if(r.photo){

  return '<img class="photo photo-only" src="'+r.photo+'" onclick="openLightbox(this.src,event)" alt="">';

 }

 return text;

}

/* 偶然 */

function renderChance(){

 const box=document.getElementById('memory');

 const past=records.filter(
  r=>r.date<todayISO()
 );

 if(!past.length){

  box.innerHTML=
   '<div class="card empty">'
   +'还没有来自过去的消息。<br>'
   +'先留下一点，未来再偶然遇见。'
   +'</div>';

 }else{

  const fromKey='futurism-from-'+todayISO();
 let savedId=localStorage.getItem(fromKey);
 let r=past.find(x=>String(x.id)===String(savedId));
 if(!r){
  r=past[Math.floor(Math.random()*past.length)];
  localStorage.setItem(fromKey,String(r.id));
 }

  box.innerHTML=
   '<div class="card">'
   +'<div class="label">FROM</div>'
   +'<div class="date">'+fmt(r.date)+'</div>'
   +mediaHtml(r)
   +'<div class="small-actions">'
   +'<button onclick="openViewer(\''+r.id+'\')">查看</button>'
   +'</div>'
   +'</div>';

 }


 /* 最近五个自然日 */

 const recent=document.getElementById('recent');

 const today=
  new Date(todayISO()+'T00:00:00');

 const cutoff=new Date(today);

 cutoff.setDate(
 cutoff.getDate()-4
 );

 const minDate=todayISODate(cutoff);

 const rs=[...records]
  .filter(
   r=>r.date>=minDate&&r.date<=todayISO()
  )
  .sort(
   (a,b)=>b.date.localeCompare(a.date)
  );

 recent.innerHTML=rs.length
  ?'<div class="label" style="margin:25px 4px 10px">RECENT</div>'
   +rs.map(
    r=>

     +mediaHtml(r)
     +'<div class="small-actions">'
     +'<button onclick="openViewer(\''+r.id+'\')">查看</button>'
     +'</div>'
     +'</div>'
   ).join('')
  :'';

}


/* 日历 */

function renderCalendar(){

 const y=currentMonth.getFullYear();
 const m=currentMonth.getMonth();

 document.getElementById('monthTitle').textContent=
  y+' · '+String(m+1).padStart(2,'0');

 const first=new Date(y,m,1);

 const start=(first.getDay()+6)%7;

 const days=
  new Date(y,m+1,0).getDate();

 let html='';


 for(let i=0;i<start;i++){

  let d=
   new Date(
    y,
    m,
    i-start+1
   );

  html+=
   '<div class="day other">'
   +'<div class="daynum">'+d.getDate()+'</div>'
   +'</div>';

 }


 for(let n=1;n<=days;n++){

  const iso=
   y+'-'
   +String(m+1).padStart(2,'0')
   +'-'
   +String(n).padStart(2,'0');

  const rs=
   records.filter(
    r=>r.date===iso
   );

  const r=
   rs.find(x=>x.photo);

  html+=
   '<button class="day '+(r?'hasphoto':'')+'"'

   +(r
    ?'<img class="thumb" src="'+r.photo+'">'
    :'')
   +'<div class="daynum">'+n+'</div>'
   +(rs.length
    ?'<i class="mark"></i>'
    :'')
   +'</button>';

 }

 document.getElementById('cal').innerHTML=html;

}

/* 照片模式与贴纸 */
function setPhotoMode(mode){
 tempPhotoMode=mode;
 document.getElementById('modeOriginal')?.classList.toggle('active',mode==='original');
 document.getElementById('modeSticker')?.classList.toggle('active',mode==='sticker');
 if(tempPhoto) processLoadedPhoto(tempPhoto,mode);
}

function processLoadedPhoto(src,mode){
 if(mode==='sticker'){
  makeSticker(src).then(x=>{tempPhoto=x;showPreview(x);});
 }else{
  compressPhoto(src).then(x=>{tempPhoto=x;showPreview(x);});
 }
}
function compressPhoto(src){
 return new Promise(resolve=>{
  const img=new Image(); img.onload=()=>{
   const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height));
   const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.width*scale)); c.height=Math.max(1,Math.round(img.height*scale));
   c.getContext('2d').drawImage(img,0,0,c.width,c.height); resolve(c.toDataURL('image/jpeg',.82));
  }; img.src=src;
 });
}
function makeSticker(src){
 return new Promise(resolve=>{
  const img=new Image(); img.onload=()=>{
   const max=900,scale=Math.min(1,max/Math.max(img.width,img.height));
   const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
   const c=document.createElement('canvas'),ctx=c.getContext('2d'); c.width=w;c.height=h;ctx.drawImage(img,0,0,w,h);
   const d=ctx.getImageData(0,0,w,h),a=d.data;
   // 对四角背景做颜色采样：适合墙面、桌面等相对均匀背景；复杂背景仍保留主体，不会破坏原图。
   const samples=[]; [[2,2],[w-3,2],[2,h-3],[w-3,h-3]].forEach(([x,y])=>{let i=(y*w+x)*4;samples.push([a[i],a[i+1],a[i+2]]);});
   const bg=samples.reduce((z,v)=>[z[0]+v[0],z[1]+v[1],z[2]+v[2]],[0,0,0]).map(x=>x/4);
   const mask=new Uint8Array(w*h); const q=[]; const seen=new Uint8Array(w*h);
   function similar(i){let dr=a[i]-bg[0],dg=a[i+1]-bg[1],db=a[i+2]-bg[2];return Math.sqrt(dr*dr+dg*dg+db*db)<48;}
   [[0,0],[w-1,0],[0,h-1],[w-1,h-1]].forEach(([x,y])=>{let k=y*w+x;if(!seen[k]&&similar(k*4)){seen[k]=1;q.push(k);}});
   for(let qi=0;qi<q.length;qi++){let k=q[qi],x=k%w,y=(k/w)|0;mask[k]=1;for(const [nx,ny] of [[x+1,y],[x-1,y],[x,y+1],[x,y-1]]){if(nx>=0&&nx<w&&ny>=0&&ny<h){let nk=ny*w+nx;if(!seen[nk]&&similar(nk*4)){seen[nk]=1;q.push(nk);}}}}
   for(let k=0;k<w*h;k++){if(mask[k])a[k*4+3]=0;}
   ctx.putImageData(d,0,0);
   // 找非透明主体边界并留出描边空间
   let minX=w,minY=h,maxX=-1,maxY=-1; for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(a[(y*w+x)*4+3]>20){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
   if(maxX<0){resolve(src);return;}
   const pad=Math.max(10,Math.round(Math.min(w,h)*.035)); minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(w-1,maxX+pad);maxY=Math.min(h-1,maxY+pad);
   const sw=maxX-minX+1,sh=maxY-minY+1,oc=document.createElement('canvas');oc.width=sw+pad*2;oc.height=sh+pad*2;const o=oc.getContext('2d');
   // 描边：多方向重复绘制，最后叠主体
   for(let yy=-3;yy<=3;yy+=1)for(let xx=-3;xx<=3;xx+=1){if(xx*xx+yy*yy<=12)o.drawImage(c,minX,minY,sw,sh,pad+xx,pad+yy,sw,sh);}
   o.globalCompositeOperation='source-in';o.fillStyle='#fff';o.fillRect(0,0,oc.width,oc.height);o.globalCompositeOperation='source-over';o.drawImage(c,minX,minY,sw,sh,pad,pad,sw,sh);
   resolve(oc.toDataURL('image/png'));
  }; img.src=src;
 });
}

/* 导入 JSON 文件 */

function importData(e){

 const f=e.target.files[0];

 if(!f)return;

 const rd=new FileReader();

 rd.onload=()=>{

  try{

   const data=
    JSON.parse(rd.result);

   const incoming=
    Array.isArray(data)
     ?data
     :data.records;

   if(!Array.isArray(incoming))
    throw new Error();


   const clean=
    incoming
     .filter(
      r=>r&&r.id&&r.date
     )
     .map(
      r=>({
       id:String(r.id),
       date:String(r.date),
       text:String(r.text||''),
       photo:String(r.photo||''),
       photoMode:r.photoMode==='sticker'?'sticker':'original'
      })
     );


   if(
    !confirm(
     '导入将与现有记录合并，重复记录会覆盖。继续吗？'
    )
   ){

    e.target.value='';

    return;

   }


   const map=
    new Map(
     records.map(
      r=>[r.id,r]
     )
    );


   clean.forEach(
    r=>map.set(r.id,r)
   );


   records=
    [...map.values()];


   persist();

   renderChance();

   renderCalendar();

   closeSettings();

   alert('导入完成');


  }catch(err){

   alert('备份文件无法读取');

  }


  e.target.value='';

 };


 rd.readAsText(f);

}

/* 每周贴纸罐 */
function startOfWeek(date){const d=new Date(date);d.setHours(0,0,0,0);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d;}
function weekKey(date){return startOfWeek(date).toISOString().slice(0,10);}
function stickerRecordsForWeek(key){const end=new Date(key+'T00:00:00');end.setDate(end.getDate()+7);const endKey=end.toISOString().slice(0,10);return records.filter(r=>r.photo&&r.photoMode==='sticker'&&r.date>=key&&r.date<endKey);}
function renderJar(){
 const base=startOfWeek(new Date());base.setDate(base.getDate()+jarWeekOffset*7);const key=weekKey(base);const rs=stickerRecordsForWeek(key);
 const end=new Date(base);end.setDate(end.getDate()+6);
 document.getElementById('jarTitle').textContent=fmt(key)+' — '+fmt(key===weekKey(new Date())?key:end.toISOString().slice(0,10));
 document.getElementById('jarWeekLabel').textContent=jarWeekOffset===0?'本周':(jarWeekOffset<0?'上一周':'下一周');
 document.getElementById('jarCount').textContent=rs.length+' 张';
 const body=document.getElementById('jarBody');body.innerHTML='';
 if(!rs.length){body.innerHTML='<div class="jar-empty">这一周还没有贴纸。<br>去写下一点东西，再把照片裁成贴纸。</div>';return;}
 const seed=key.split('-').reduce((a,v)=>a+Number(v),0);let rand=mulberry32(seed);
 const placed=[];
 rs.forEach((r,i)=>{
  const im=document.createElement('img');im.className='jar-sticker';im.src=r.photo;
  let x=8,y=10,ok=false;
  for(let attempt=0;attempt<80;attempt++){
   const tx=8+rand()*78,ty=10+rand()*78;
   if(placed.every(p=>Math.hypot((tx-p.x)*.9,ty-p.y)>.14)){x=tx;y=ty;ok=true;break;}
  }
  if(!ok){x=8+rand()*78;y=10+rand()*78;}
  placed.push({x:x/100,y:y/100});
  const rot=-11+rand()*22,scale=.82+rand()*.30;
  im.style.left=x+'%';im.style.top=y+'%';im.style.transform=`translate(-50%,-50%) rotate(${rot}deg) scale(${scale})`;im.title=fmt(r.date);body.appendChild(im);
 });
}
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}}
function changeJarWeek(n){jarWeekOffset+=n;renderJar();}
function jumpToCurrentWeek(){jarWeekOffset=0;renderJar();}

 }

},30000);
