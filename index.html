<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名词解释刷题工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    max-width:760px;
    margin:20px auto;
    padding:0 16px;
    background:#f7f8fa;
}
.tab-bar{
    display:flex;
    gap:8px;
    margin-bottom:20px;
}
.tab-btn{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    background:#ddd;
}
.tab-btn.active{
    background:#6366f1;
    color:#fff;
}
.view{
    display:none;
}
.view.active{
    display:block;
}

/* 刷题模式样式 */
.card{
    background:#fff;
    padding:28px 22px;
    border-radius:14px;
    box-shadow:0 1px 6px #00000015;
    margin-bottom:24px;
}
.question{
    font-size:18px;
    font-weight:bold;
    line-height:1.6;
    margin-bottom:20px;
}
.answer{
    font-size:15.5px;
    line-height:1.7;
    color:#222;
    background:#f3f4f6;
    padding:16px;
    border-radius:10px;
    display:none;
    white-space:pre-wrap;
}
.btn-wrap{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}
button{
    flex:1;
    min-width:100px;
    padding:13px;
    border:none;
    border-radius:10px;
    font-size:15px;
    cursor:pointer;
}
.btn-show{background:#6366f1;color:white;}
.btn-prev{background:#9ca3af;color:white;}
.btn-next{background:#2563eb;color:white;}
.index-text{
    text-align:center;
    margin-bottom:16px;
    color:#666;
}

/* 卡片检索模式 */
.search-input{
    width:100%;
    padding:12px 14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    margin-bottom:16px;
}
.card-item{
    background:#fff;
    border-radius:12px;
    padding:16px;
    margin-bottom:12px;
    box-shadow:0 1px 4px #00000012;
}
.card-item-title{
    font-weight:bold;
    font-size:17px;
    margin-bottom:8px;
    cursor:pointer;
    user-select:none;
}
.card-item-ans{
    font-size:15px;
    line-height:1.65;
    color:#333;
    padding-top:8px;
    border-top:1px solid #eee;
    display:none;
}
</style>
</head>
<body>

<div class="tab-bar">
    <button class="tab-btn active" data-view="studyView">顺序刷题模式</button>
    <button class="tab-btn" data-view="cardView">卡片检索模式</button>
</div>

<!-- 模式1：顺序刷题 -->
<div id="studyView" class="view active">
    <div class="index-text">
        <span id="pageInfo"></span>
    </div>
    <div class="card">
        <div class="question" id="qText"></div>
        <div class="answer" id="aText"></div>
    </div>
    <div class="btn-wrap">
        <button class="btn-prev" id="prevBtn">上一题</button>
        <button class="btn-show" id="showBtn">显示/隐藏答案</button>
        <button class="btn-next" id="nextBtn">下一题</button>
    </div>
</div>

<!-- 模式2：卡片检索（可搜索，点击展开答案） -->
<div id="cardView" class="view">
    <input class="search-input" id="searchInput" placeholder="🔍输入名词快速搜索，例如：营造法式">
    <div id="cardList"></div>
</div>

// --------标签切换逻辑
const tabBtns = document.querySelectorAll('.tab-btn');
const views = document.querySelectorAll('.view');
tabBtns.forEach(btn=>{
    btn.onclick = function(){
        const targetId = this.getAttribute('data-view');
        tabBtns.forEach(b=>b.classList.remove('active'));
        this.classList.add('active');
        views.forEach(v=>v.classList.remove('active'));
        document.getElementById(targetId).classList.add('active');
    }
})

// --------刷题模式逻辑
let current = 0;
const qDom = document.getElementById('qText');
const aDom = document.getElementById('aText');
const pageDom = document.getElementById('pageInfo');

function renderStudy(){
    let item = questionBank[current];
    qDom.innerText = item.q;
    aDom.innerText = item.a;
    aDom.style.display = 'none';
    pageDom.innerText = `${current+1} / ${questionBank.length}`;
}

document.getElementById('showBtn').onclick = function(){
    aDom.style.display = aDom.style.display === 'block' ? 'none' : 'block';
}
document.getElementById('nextBtn').onclick = function(){
    if(current < questionBank.length -1) current++;
    renderStudy();
}
document.getElementById('prevBtn').onclick = function(){
    if(current > 0) current--;
    renderStudy();
}
renderStudy();


// --------卡片检索模式逻辑
const cardList = document.getElementById('cardList');
const searchInput = document.getElementById('searchInput');

function renderCardList(list){
    cardList.innerHTML = '';
    list.forEach((obj,idx)=>{
        const div = document.createElement('div');
        div.className = 'card-item';
        div.innerHTML = `
            <div class="card-item-title" data-idx="${idx}">📖 ${obj.q}</div>
            <div class="card-item-ans">${obj.a}</div>
        `;
        const titleDom = div.querySelector('.card-item-title');
        const ansDom = div.querySelector('.card-item-ans');
        titleDom.onclick = ()=>{
            ansDom.style.display = ansDom.style.display === 'block' ? 'none' : 'block';
        }
        cardList.appendChild(div);
    })
}

//搜索过滤
searchInput.oninput = function(){
    let kw = this.value.trim().toLowerCase();
    if(!kw){
        renderCardList(questionBank);
        return;
    }
    let filter = questionBank.filter(x=> x.q.toLowerCase().includes(kw) || x.a.toLowerCase().includes(kw));
    renderCardList(filter);
}
//初始化渲染全部卡片
renderCardList(questionBank);
